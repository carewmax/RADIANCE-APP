<style>
/* Layout: campaign-blue clinic. Public site = white clinical surfaces with the clinic's cyan squiggle pattern reserved for hero, campaigns and CTA bands; patient app = sidebar rail / bottom bar; staff console = dense navy rail. */
:root{
  /* RADIANCE brand tokens (sampled from the clinic's logo and campaign artwork) */
  --blue:#2A8C93; --blue-deep:#1F5F66; --green:#3DAA6B; --green-deep:#2B8552; --navy:#173F45; --leaf:#65AA29;
  --bg:#F5F9F9; --surface:#FFFFFF; --surface-2:#EEF5F5; --fg:#22383C; --heading:#173F45; --muted:#5A7276; --line:#DDE8E8; --line-2:#C6D9D9;
  --accent:#1F6E75; --accent-fg:#FFFFFF; --forest-2:#1F6E75; --sage:#9CCFD1; --sage-soft:#E3F1F1; --lavender:#E6F4EB; --beige:#EEF2F2; --ivory:#F5F9F9; --paper:#FFFFFF;
  --amber:#9A5B05; --amber-soft:#FBEED6; --red:#B0322A; --red-soft:#F8E0DD; --ok:#2B8552; --ok-soft:#E3F3E8;
  --band:#1F5F66; --band-ink:#FFFFFF; --band-2:#174C52; --footer:#164A50; --footer-ink:#D5E6E7; --hero-fade:rgba(23,72,78,.94);
  --shadow:0 1px 2px rgba(18,52,74,.06),0 8px 24px -12px rgba(18,52,74,.22);
  --f-display:"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1A1C; --surface:#112528; --surface-2:#162F33; --fg:#DCECEC; --heading:#F0F8F8; --muted:#93B0B2; --line:#1F3C40; --line-2:#2B4F53;
  --accent:#6CC5C9; --accent-fg:#06272A; --forest-2:#6CC5C9; --sage:#2D6E72; --sage-soft:#123538; --lavender:#16301F; --beige:#1A2D30; --blue:#6CC5C9; --navy:#E6F4F4;
  --green:#4CC07F; --green-deep:#7AD6A0; --amber:#E7B062; --amber-soft:#3A2D18; --red:#EE8F84; --red-soft:#3C2220; --ok:#7AD6A0; --ok-soft:#173322;
  --band:#123E43; --band-2:#0E3337; --footer:#08211F; --footer-ink:#C7DCDD; --hero-fade:rgba(10,40,44,.95);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A1C; --surface:#112528; --surface-2:#162F33; --fg:#DCECEC; --heading:#F0F8F8; --muted:#93B0B2; --line:#1F3C40; --line-2:#2B4F53;
  --accent:#6CC5C9; --accent-fg:#06272A; --forest-2:#6CC5C9; --sage:#2D6E72; --sage-soft:#123538; --lavender:#16301F; --beige:#1A2D30; --blue:#6CC5C9; --navy:#E6F4F4;
  --green:#4CC07F; --green-deep:#7AD6A0; --amber:#E7B062; --amber-soft:#3A2D18; --red:#EE8F84; --red-soft:#3C2220; --ok:#7AD6A0; --ok-soft:#173322;
  --band:#123E43; --band-2:#0E3337; --footer:#08211F; --footer-ink:#C7DCDD; --hero-fade:rgba(10,40,44,.95);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:.9375rem/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0;line-height:1.12;color:var(--heading)}
h1{font-size:clamp(1.9rem,3.6vw,2.6rem)} h2{font-size:1.55rem} h3{font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
p{margin:0} a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em}
.label{font-family:var(--f-body);font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-family:var(--f-display);font-size:1.1rem}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--sage-soft);color:var(--fg)}
.rail .sep{height:1px;background:var(--line);margin:10px 8px}
.rail .foot{margin-top:auto;padding:10px 8px 0}
.store-pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sage)} .dot.warn{background:var(--amber)} .dot.ok{background:var(--ok)}
main{min-width:0;padding:26px clamp(16px,4vw,44px) 110px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.topbar .actions{display:flex;gap:8px;align-items:center}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--amber);color:#fff;font-size:.65rem;display:grid;place-items:center;font-weight:700}
.bottom{display:none}

@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted);padding:6px 8px;border-radius:10px;cursor:pointer;min-width:58px}
  .bottom button svg{width:20px;height:20px}
  .bottom button[aria-current="page"]{color:var(--accent);background:var(--sage-soft)}
  main{padding-top:18px}
}

/* primitives */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.raised{box-shadow:var(--shadow)}
.card.tint{background:var(--sage-soft);border-color:transparent}
.card.lav{background:var(--lavender);border-color:transparent}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 18px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:6px 12px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.chip.self{background:var(--beige);border-color:transparent}
.chip.ai{background:var(--lavender);border-color:transparent}
.chip.clin{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.err{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.toggle-chip{cursor:pointer}
.toggle-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:.84rem;font-weight:600}
.field small{color:var(--muted);font-size:.78rem}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:0;border-color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);gap:8px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.88rem;align-items:flex-start}
.notice.warn{background:var(--amber-soft)} .notice.err{background:var(--red-soft)} .notice.ok{background:var(--ok-soft)}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.list>.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:none}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h p{max-width:62ch;margin-top:6px}

/* ID card */
.idcard{position:relative;border-radius:18px;padding:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.idcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,transparent 14px 20px)}
.idcard .code{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em}

/* scale */
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.scale i{height:7px;border-radius:4px;background:var(--line)}
.scale i.on{background:var(--accent)}

/* face map */
.facemap{width:100%;max-width:300px;margin:0 auto;display:block}
.facemap .rg{fill:var(--sage-soft);stroke:var(--line-2);stroke-width:1.2;cursor:pointer;transition:fill .15s}
.facemap .rg:hover{fill:var(--sage)}
.facemap .rg.has{fill:var(--lavender);stroke:var(--accent)}
.facemap .rg.sel{fill:var(--accent)}
.facemap .outline{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5}

/* capture */
.capture{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.capture{grid-template-columns:minmax(0,1fr)}}
.viewport{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:18px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);display:grid;place-items:center}
.viewport img{width:100%;height:100%;object-fit:cover}
.guide-oval{position:absolute;inset:12% 20% 16%;border:2px dashed var(--sage);border-radius:50%;pointer-events:none}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;gap:8px;align-items:center;font-size:.84rem;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.check b{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* compare */
.cmp{position:relative;aspect-ratio:3/4;max-width:460px;width:100%;border-radius:16px;overflow:hidden;background:var(--surface-2);user-select:none;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .after{clip-path:inset(0 0 0 50%)}
.cmp .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.cmp .handle::after{content:"";position:absolute;top:50%;left:50%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:var(--shadow)}
.cmp input{position:absolute;inset:0;width:100%;opacity:0;cursor:ew-resize}
.cmp .tag{position:absolute;top:10px;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;font-family:var(--f-mono)}

/* routine */
.step{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.step input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.step.done .lbl{text-decoration:line-through;color:var(--muted)}
.step .lbl{flex:1;min-width:0}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--line-2)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item::before{content:"";position:absolute;left:-20px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-item[data-cat="hair"]::before{border-color:var(--green)} .tl-item[data-cat="product"]::before{border-color:var(--amber)} .tl-item[data-cat="reaction"]::before{border-color:var(--red)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px}
.msg{max-width:min(78ch,92%);padding:12px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg-actions{display:flex;gap:4px;margin-top:8px}
.composer{display:flex;gap:8px;position:sticky;bottom:0;padding:12px 0;background:var(--bg)}
@media (max-width:860px){.composer{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
.composer textarea{min-height:46px;height:46px;border-radius:24px;padding:12px 16px}

/* modal / toast / panel */
.scrim{position:fixed;inset:0;background:rgba(8,28,40,.5);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{max-width:860px}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;box-shadow:var(--shadow);animation:rise .2s}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.sheet{position:fixed;right:16px;top:70px;z-index:40;width:min(360px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;max-height:70vh;overflow:auto}

/* onboarding */
.ob{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.ob-steps{display:flex;gap:6px;margin:18px 0 26px}
.ob-steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.ob-steps i.on{background:var(--accent)}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.choice{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:500}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--sage-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(2.6rem,7vw,4.2rem);line-height:.98}
.hero h1 em{color:var(--accent)}
.specimen{border-radius:22px;background:var(--lavender);padding:22px;display:grid;gap:12px}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.article{max-width:68ch}
.article p{margin:0 0 12px}
.report{font-size:.9rem}
.report h3{margin:16px 0 6px}
@media (max-width:860px){#assess-grid,#skinid-grid,#poro-grid,#len-grid,#cmp-grid,#coach-grid{grid-template-columns:minmax(0,1fr)!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== shared brand bits ===== */
.lockup{display:inline-flex;align-items:center;gap:10px;text-align:left}
.lockup b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.18rem;letter-spacing:.06em;color:var(--heading);line-height:1}
.lockup small{display:block;font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;white-space:nowrap}
.lockup .mark{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
.lockup .mark img{height:30px;width:auto}
.on-dark .lockup b{color:#fff}.on-dark .lockup small{color:rgba(255,255,255,.82)}
.brand-btn{border:0;background:none;padding:0 8px 18px;cursor:pointer;color:inherit}
.m-brand{display:none;border:0;background:none;padding:0;cursor:pointer}
@media (max-width:860px){.m-brand{display:block}}
#main:focus{outline:none}
.logo-badge{background:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 40px -10px rgba(0,40,45,.45)}
.pattern{background:var(--band);color:var(--band-ink)}
.clinic-strip{border-left:4px solid var(--blue)}
.chip svg{width:13px;height:13px}
.ai-note svg,p>svg{width:16px;height:16px;vertical-align:-3px}

/* ===== public site ===== */

/* header sits on the photo hero, as in the reference */

@media (max-width:640px){.s-cta .hide-m{display:none}.s-cta .btn.green{padding:7px 12px;font-size:.78rem}}

.btn.green{background:var(--green);border-color:var(--green);color:#fff}

.btn.white{background:#fff;border-color:#fff;color:var(--band)}
.btn.outline-w{background:transparent;border-color:rgba(255,255,255,.85);color:#fff}
.btn.lg{padding:12px 24px;font-size:.95rem}
.site .btn{font-family:var(--f-display);font-weight:600}
.m-menu{position:fixed;inset:0;z-index:45;background:var(--surface);color:var(--fg);overflow:auto;padding:16px;animation:fade .15s}

/* photo heroes */
.p-hero{position:relative;color:#fff;background:var(--band);overflow:hidden;isolation:isolate}

.sec{padding-block:clamp(40px,6vw,72px)}

@media (max-width:860px){.s-foot .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.s-foot .wrap{grid-template-columns:minmax(0,1fr)}}
.s-foot h4{margin:0 0 10px;color:#fff;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-family:var(--f-display)}
.s-foot button,.s-foot a{display:block;background:none;border:0;color:var(--footer-ink);padding:4px 0;cursor:pointer;text-align:left;font-size:.88rem;text-decoration:none}
.s-foot button:hover,.s-foot a:hover{color:#fff;text-decoration:underline}
.s-foot .legal{border-top:1px solid rgba(255,255,255,.12);padding-block:14px;font-size:.78rem;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.socials{display:flex;gap:8px}
.socials a{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid!important;place-items:center;padding:0!important}
.socials svg{width:16px;height:16px}

/* booking widgets (unchanged behaviour) */
.stepper{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.stepper span{flex:1;min-width:70px;font-size:.74rem;font-weight:700;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.stepper span.on{border-color:var(--green);color:var(--heading)}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 6px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.slot[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dayb{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:8px 2px;cursor:pointer;display:grid;gap:2px;justify-items:center;font-size:.78rem;min-width:0}
.dayb b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.dayb[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.dayb[disabled]{opacity:.35;cursor:not-allowed}
.err-text{color:var(--red);font-size:.8rem;font-weight:600}
input[type=tel],input[type=password],input[type=time],input[type=search]{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
[aria-invalid="true"]{border-color:var(--red)!important}
.site .card{border-radius:12px}
.site h1,.site h2,.site h3{font-weight:700}
.reveal{animation:rise .5s both}
@media (prefers-reduced-motion: reduce){.pcard:hover{transform:none}}

/* ===== staff console ===== */
.staff{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.st-rail{position:sticky;top:0;height:100vh;background:var(--footer);color:var(--footer-ink);padding:18px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.st-rail .lockup b{color:#fff}.st-rail .lockup small{color:#CFE3E4}
.st-rail button.nav-btn{color:var(--footer-ink)}
.st-rail button.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.st-rail button.nav-btn[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--green)}
.st-main{min-width:0;padding:22px clamp(16px,3vw,36px) 90px}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.demo-flag{background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:700}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px;min-width:0}
.stat b{font-family:var(--f-display);font-size:1.9rem;color:var(--heading);font-variant-numeric:tabular-nums;line-height:1}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.src-block{border-left:4px solid var(--line-2);padding:10px 14px;border-radius:0 12px 12px 0;background:var(--surface-2)}
.src-block.ai{border-color:#7FB648;background:var(--lavender)}
.src-block.clin{border-color:var(--blue);background:var(--sage-soft)}
.src-block.self{border-color:#9AA9B3;background:var(--beige)}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;min-width:930px}
.week .col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;align-content:start;min-height:160px}
.week .ap{border-radius:8px;padding:6px 8px;font-size:.78rem;background:var(--sage-soft);border-left:3px solid var(--blue);cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;color:var(--fg)}
.week .ap.req{background:var(--amber-soft);border-left-color:var(--amber)}
@media (max-width:860px){.staff{grid-template-columns:minmax(0,1fr)}.st-rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.st-rail .lockup,.st-rail .sep,.st-rail .foot{display:none}.st-rail button.nav-btn{width:auto;font-size:.8rem;padding:7px 9px}}

/* ============ Phone app layout (Android app + phone browsers) ============ */
.mx{--lime:#8CC63F;--lime-ink:#0E3A2E;min-height:100%;background:var(--bg)}
.btn.lime{background:var(--lime,#8CC63F);border-color:transparent;color:var(--lime-ink,#0E3A2E);font-weight:700}
.btn.lime:hover{filter:brightness(1.05)}
.mx-head{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;color:#fff;transition:background .2s,box-shadow .2s}
.mx-head.over{background:linear-gradient(180deg,rgba(12,48,52,.6),rgba(12,48,52,0))}
.mx-head.over.scrolled,.mx-head.solid{background:var(--band);box-shadow:0 4px 16px -10px rgba(0,0,0,.5)}
.mx-ib{width:42px;height:42px;border:0;border-radius:12px;background:transparent;color:inherit;display:grid;place-items:center;position:relative;cursor:pointer;flex:none}
.mx-ib svg{width:23px;height:23px}
.mx-ib .badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--lime);color:var(--lime-ink);font:700 .66rem/18px var(--f-body)}
.mx-ib .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 2px var(--band)}
.mx-brand{display:flex;align-items:center;gap:9px;border:0;background:none;color:#fff;padding:0;cursor:pointer;min-width:0;text-align:left}
.mx-mark{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 2px 8px -3px rgba(0,0,0,.35)}
.mx-mark img{width:auto;display:block}
.mx-brand b{display:block;font:800 1.08rem/1 var(--f-display);letter-spacing:.05em}
.mx-brand small{display:block;font:600 .5rem/1.2 var(--f-body);letter-spacing:.13em;text-transform:uppercase;opacity:.9;margin-top:3px;white-space:nowrap}
.mx-title{display:flex;align-items:center;gap:10px;min-width:0;font:700 1.05rem var(--f-display)}
.mx-title .mx-mark{width:30px;height:30px}
.mx-title b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-acts{margin-left:auto;display:flex}
main.mx-main{display:block;padding:0;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));min-height:100vh}
.mx-main:focus{outline:none}
.mx-hero{position:relative;min-height:290px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(160deg,var(--blue),var(--band));overflow:hidden;padding:calc(84px + env(safe-area-inset-top,0px)) 20px 48px}
.mx-hero .bg{position:absolute;inset:0}
.mx-hero .bg img{width:100%;height:100%;object-fit:cover;display:block}
.mx-hero .bg img.broken{display:none}
.mx-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,58,64,.35) 0%,rgba(16,64,70,.45) 40%,rgba(18,70,76,.93) 100%)}
.mx-hero .in{position:relative;z-index:1;max-width:520px}
.mx-hero h1{color:#fff;font-size:1.75rem;line-height:1.08}
.mx-hero p{margin-top:8px;font-size:.93rem;color:rgba(255,255,255,.92);max-width:34ch}
.mx-hero.home{min-height:470px}
.mx-hero.home h1{font-size:2rem;text-transform:uppercase;letter-spacing:-.01em;max-width:12ch}
.mx-hero.short{min-height:230px}
.mx-hero .btn.outline-w{border-color:rgba(255,255,255,.7);color:#fff;background:transparent}
.mx-sheet{position:relative;z-index:2;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding:22px 16px 14px;min-height:50vh}
.mx-sheet.flat{margin-top:0;border-radius:0;padding-top:calc(76px + env(safe-area-inset-top,0px))}
.mx-sheet .sec{padding:12px 0}.mx-sheet .sec.tight{padding:10px 0}.mx-sheet .wrap{padding:0;max-width:none;width:auto}
.mx-sheet .sec.tint{background:transparent}
.mx-sheet h2{font-size:1.2rem}
.mx-sheet .crumbs{display:none}
.mx-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.mx-h h2{font-size:1.15rem}
.mx-h button{border:0;background:none;color:var(--accent);font-weight:700;font-size:.82rem;cursor:pointer;display:inline-flex;gap:4px;align-items:center;padding:4px 0}
.mx-h button svg{width:15px;height:15px}
.mx-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mx-tile{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px 14px;display:grid;gap:12px;justify-items:start;text-align:left;cursor:pointer;color:var(--heading);box-shadow:var(--shadow)}
.mx-tile .ic{width:48px;height:48px;border-radius:16px;background:var(--sage-soft);color:var(--accent);display:grid;place-items:center}
.mx-tile .ic svg{width:26px;height:26px}
.mx-tile b{font-size:.92rem}
.mx-seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--shadow)}
.mx-seg::-webkit-scrollbar,.mx-chips::-webkit-scrollbar,.mx-hscroll::-webkit-scrollbar{display:none}
.mx-seg button{flex:1 0 auto;border:0;background:none;border-radius:999px;padding:9px 14px;font-weight:700;font-size:.8rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.mx-seg button[aria-pressed=true]{background:var(--band);color:#fff}
.mx-chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.mx-chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 18px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--fg);flex:none}
.mx-chips button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.mx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mx-card{border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;text-align:left;padding:0;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;box-shadow:var(--shadow);font:inherit}
.mx-card .im{display:grid;place-items:center;aspect-ratio:4/3;background:linear-gradient(135deg,var(--blue),var(--band));overflow:hidden}
.mx-card .im img{width:100%;height:100%;object-fit:cover;display:block}
.mx-card .im img.broken{width:42%;height:auto;object-fit:contain;background:#fff;border-radius:50%;padding:8px}
.mx-card .bd{padding:10px 12px 12px;display:grid;gap:5px;align-content:start}
.mx-card h3{font-size:.86rem;line-height:1.25}
.mx-card p{font-size:.75rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.mx-card .more{font-size:.76rem;font-weight:700;color:var(--green-deep)}
.mx-card .btn{justify-self:start;margin-top:4px}
.mx-ba .pair{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:4/3;gap:2px;background:var(--line)}
.mx-ba .pair img{width:100%;height:100%;object-fit:cover}
.mx-list{display:grid;gap:10px}
.mx-row{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;font-size:.9rem}
.mx-row:disabled{opacity:1;cursor:default}
.mx-row[aria-pressed=true]{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.mx-row .ic{width:40px;height:40px;border-radius:50%;background:var(--sage-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mx-row .ic svg{width:20px;height:20px}
.mx-row .grow{flex:1;min-width:0}
.mx-row b{font-weight:600;color:var(--heading)}
.mx-row small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.mx-row>svg{width:18px;height:18px;color:var(--muted);flex:none}
.mx-row[aria-pressed=true]>svg{color:var(--green)}
.mx-menu{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:2px 12px;box-shadow:var(--shadow)}
.mx-menu .mx-row{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:12px 2px}
.mx-menu .mx-row:last-child{border-bottom:0}
.mx-menu .mx-row .ic{width:34px;height:34px;background:transparent}
.mx-steps{display:grid;gap:10px;margin:2px 0 20px}
.mx-cta{width:100%;padding:14px 18px;font-size:1rem}
.mx-sub{font-size:.98rem;margin:20px 0 10px}
.mx-promo{border-radius:20px;background:linear-gradient(135deg,var(--band),var(--blue));color:#fff;padding:18px;display:grid;gap:8px}
.mx-promo h3{color:#fff;font-size:1.05rem}
.mx-promo .btn.outline-w{border-color:rgba(255,255,255,.7);color:#fff;background:transparent}
.mx-help{border-radius:20px;background:var(--band);color:#fff;padding:16px;display:grid;gap:12px}
.mx-help b{color:#fff}.mx-help p{font-size:.84rem;opacity:.88;margin-top:2px}
.mx-help .btn.outline-w{border-color:rgba(255,255,255,.7);color:#fff;background:transparent}
.mx-help .btn svg{width:16px;height:16px}
.mx-hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.mx-hscroll>*{scroll-snap-align:start;flex:0 0 72%}
.mx-camp{border-radius:18px;padding:16px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;align-content:start;box-shadow:var(--shadow)}
.mx-camp h3{font-size:.98rem}.mx-camp p{font-size:.82rem;color:var(--muted)}.mx-camp .btn{justify-self:start}
.mx-profile{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.mx-profile .grow{flex:1;min-width:0}.mx-profile b{display:block;color:var(--heading);overflow:hidden;text-overflow:ellipsis}.mx-profile small{color:var(--muted);font-size:.8rem}
.mx-avatar{width:56px;height:56px;border-radius:50%;background:var(--sage-soft);color:var(--accent);display:grid;place-items:center;flex:none;font:800 1.4rem var(--f-display)}
.mx-avatar svg{width:26px;height:26px}
.mx-success{width:66px;height:66px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto}
.mx-success svg{width:34px;height:34px;stroke-width:2.4}
.mx-note{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--fg);font:inherit}
.mx-note:disabled{cursor:default;opacity:1}
.mx-note .ic{width:38px;height:38px;border-radius:12px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;flex:none}
.mx-note .ic svg{width:19px;height:19px}
.mx-note .grow{flex:1;min-width:0}.mx-note b{display:block;font-size:.88rem;color:var(--heading)}.mx-note small{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}
.mx-note .when{font-size:.72rem;color:var(--muted);white-space:nowrap}
.mx-line{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px}
.mx-line .im{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--sage-soft);display:grid;place-items:center;flex:none}
.mx-line .im img{width:100%;height:100%;object-fit:cover}.mx-line .im img.broken{width:60%;height:auto}
.mx-line .grow{flex:1;min-width:0}.mx-line b{display:block;font-size:.88rem}.mx-line small{display:block;color:var(--muted)}
.mx-qty{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:6px}
.mx-qty button{width:28px;height:28px;border-radius:50%;border:0;background:var(--sage-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.mx-qty svg{width:15px;height:15px}.mx-qty b{min-width:14px;text-align:center;font-size:.86rem}
.mx-sum{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:16px 0;font-size:.9rem}
.mx-sum dt{color:var(--muted)}.mx-sum dd{margin:0;text-align:right}
.mx-steps-bar{display:flex;justify-content:space-between;gap:6px;margin-bottom:6px}
.mx-steps-bar span{flex:1;text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);border-bottom:3px solid var(--line);padding-bottom:6px}
.mx-steps-bar span.on{color:var(--accent);border-color:var(--green)}
.mx-signin-logo{display:grid;justify-items:center;text-align:center;margin:4px 0 18px}
.mx-signin-logo img{height:84px;width:auto;margin-bottom:8px}
.mx-signin-logo b{font:800 1.6rem/1 var(--f-display);color:var(--blue-deep);letter-spacing:.03em}
.mx-signin-logo small{font:700 .66rem var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-deep);margin-top:4px}
.mx-tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -16px rgba(0,0,0,.35)}
.mx-tabs button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:6px 0 4px;font:600 .68rem var(--f-body);color:var(--muted);cursor:pointer;border-radius:12px}
.mx-tabs svg{width:23px;height:23px}
.mx-tabs button[aria-current=page]{color:var(--accent)}
.mx-tabs button[aria-current=page] svg{stroke-width:2.3}
.mx-tabs button[aria-current=page] span{font-weight:800}
.mx-drawer{position:fixed;inset:0;z-index:60}
.mx-scrim{position:absolute;inset:0;border:0;background:rgba(6,30,33,.5);cursor:pointer}
.mx-panel{position:absolute;top:0;left:0;bottom:0;width:min(84vw,330px);background:var(--surface);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 20px;overflow-y:auto;box-shadow:8px 0 30px -10px rgba(0,0,0,.4);animation:mxin .2s ease-out}
@keyframes mxin{from{transform:translateX(-100%)}to{transform:none}}
.mx-dnav{display:grid;gap:2px}
.mx-dnav button{display:flex;align-items:center;gap:14px;border:0;background:none;padding:11px 8px;border-radius:12px;font:600 .95rem var(--f-body);color:var(--fg);cursor:pointer;text-align:left}
.mx-dnav button:hover{background:var(--sage-soft)}
.mx-dnav svg{width:20px;height:20px;color:var(--accent)}
.mx-splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:linear-gradient(180deg,#EEF9F8 0%,#C9E9E7 50%,#2A8C93 100%);transition:opacity .45s}
.mx-splash.out{opacity:0}
.mx-splash .lg{display:grid;justify-items:center;text-align:center;gap:6px;margin-top:-60px}
.mx-splash img{height:140px;width:auto;margin-bottom:10px}
.mx-splash b{font:800 2.4rem/1 var(--f-display);color:#1F5F66;letter-spacing:.03em}
.mx-splash small{font:700 .8rem/1.3 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#1F5F66;max-width:210px}
