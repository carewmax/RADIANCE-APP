<style>
/* Layout: campaign-blue clinic. Public site = white clinical surfaces with the clinic's cyan squiggle pattern reserved for hero, campaigns and CTA bands; patient app = sidebar rail / bottom bar; staff console = dense navy rail. */
:root{
  /* RADIANCE brand tokens (sampled from the clinic's logo and campaign artwork) */
  --blue:#2A8C93; --blue-deep:#1F5F66; --green:#3DAA6B; --green-deep:#2B8552; --navy:#173F45; --leaf:#65AA29;
  --bg:#F5F9F9; --surface:#FFFFFF; --surface-2:#EEF5F5; --fg:#22383C; --heading:#173F45; --muted:#5A7276; --line:#DDE8E8; --line-2:#C6D9D9;
  --accent:#1F6E75; --accent-fg:#FFFFFF; --forest-2:#1F6E75; --sage:#9CCFD1; --sage-soft:#E3F1F1; --lavender:#E6F4EB; --beige:#EEF2F2; --ivory:#F5F9F9; --paper:#FFFFFF;
  --amber:#9A5B05; --amber-soft:#FBEED6; --red:#B0322A; --red-soft:#F8E0DD; --ok:#2B8552; --ok-soft:#E3F3E8;
  --band:#1F5F66; --band-ink:#FFFFFF; --band-2:#174C52; --footer:#164A50; --footer-ink:#D5E6E7; --hero-fade:rgba(23,72,78,.94);

  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1A1C; --surface:#112528; --surface-2:#162F33; --fg:#DCECEC; --heading:#F0F8F8; --muted:#93B0B2; --line:#1F3C40; --line-2:#2B4F53;
  --accent:#6CC5C9; --accent-fg:#06272A; --forest-2:#6CC5C9; --sage:#2D6E72; --sage-soft:#123538; --lavender:#16301F; --beige:#1A2D30; --blue:#6CC5C9; --navy:#E6F4F4;
  --green:#4CC07F; --green-deep:#7AD6A0; --amber:#E7B062; --amber-soft:#3A2D18; --red:#EE8F84; --red-soft:#3C2220; --ok:#7AD6A0; --ok-soft:#173322;
  --band:#123E43; --band-2:#0E3337; --footer:#08211F; --footer-ink:#C7DCDD; --hero-fade:rgba(10,40,44,.95);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A1C; --surface:#112528; --surface-2:#162F33; --fg:#DCECEC; --heading:#F0F8F8; --muted:#93B0B2; --line:#1F3C40; --line-2:#2B4F53;
  --accent:#6CC5C9; --accent-fg:#06272A; --forest-2:#6CC5C9; --sage:#2D6E72; --sage-soft:#123538; --lavender:#16301F; --beige:#1A2D30; --blue:#6CC5C9; --navy:#E6F4F4;
  --green:#4CC07F; --green-deep:#7AD6A0; --amber:#E7B062; --amber-soft:#3A2D18; --red:#EE8F84; --red-soft:#3C2220; --ok:#7AD6A0; --ok-soft:#173322;
  --band:#123E43; --band-2:#0E3337; --footer:#08211F; --footer-ink:#C7DCDD; --hero-fade:rgba(10,40,44,.95);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:.9375rem/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0;line-height:1.12;color:var(--heading)}
h1{font-size:clamp(1.9rem,3.6vw,2.6rem)} h2{font-size:1.55rem} h3{font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
p{margin:0} a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em}
.label{font-family:var(--f-body);font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-family:var(--f-display);font-size:1.1rem}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--sage-soft);color:var(--fg)}
.rail .sep{height:1px;background:var(--line);margin:10px 8px}
.rail .foot{margin-top:auto;padding:10px 8px 0}
.store-pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sage)} .dot.warn{background:var(--amber)} .dot.ok{background:var(--ok)}
main{min-width:0;padding:26px clamp(16px,4vw,44px) 110px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.topbar .actions{display:flex;gap:8px;align-items:center}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--amber);color:#fff;font-size:.65rem;display:grid;place-items:center;font-weight:700}
.bottom{display:none}

@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted);padding:6px 8px;border-radius:10px;cursor:pointer;min-width:58px}
  .bottom button svg{width:20px;height:20px}
  .bottom button[aria-current="page"]{color:var(--accent);background:var(--sage-soft)}
  main{padding-top:18px}
}

/* primitives */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.raised{box-shadow:var(--shadow)}
.card.tint{background:var(--sage-soft);border-color:transparent}
.card.lav{background:var(--lavender);border-color:transparent}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 18px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:6px 12px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.chip.self{background:var(--beige);border-color:transparent}
.chip.ai{background:var(--lavender);border-color:transparent}
.chip.clin{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.err{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.toggle-chip{cursor:pointer}
.toggle-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:.84rem;font-weight:600}
.field small{color:var(--muted);font-size:.78rem}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:0;border-color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);gap:8px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.88rem;align-items:flex-start}
.notice.warn{background:var(--amber-soft)} .notice.err{background:var(--red-soft)} .notice.ok{background:var(--ok-soft)}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.list>.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:none}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h p{max-width:62ch;margin-top:6px}

/* ID card */
.idcard{position:relative;border-radius:18px;padding:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.idcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,transparent 14px 20px)}
.idcard .code{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em}

/* scale */
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.scale i{height:7px;border-radius:4px;background:var(--line)}
.scale i.on{background:var(--accent)}

/* face map */
.facemap{width:100%;max-width:300px;margin:0 auto;display:block}
.facemap .rg{fill:var(--sage-soft);stroke:var(--line-2);stroke-width:1.2;cursor:pointer;transition:fill .15s}
.facemap .rg:hover{fill:var(--sage)}
.facemap .rg.has{fill:var(--lavender);stroke:var(--accent)}
.facemap .rg.sel{fill:var(--accent)}
.facemap .outline{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5}

/* capture */
.capture{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.capture{grid-template-columns:minmax(0,1fr)}}
.viewport{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:18px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);display:grid;place-items:center}
.viewport img{width:100%;height:100%;object-fit:cover}
.guide-oval{position:absolute;inset:12% 20% 16%;border:2px dashed var(--sage);border-radius:50%;pointer-events:none}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;gap:8px;align-items:center;font-size:.84rem;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.check b{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* compare */
.cmp{position:relative;aspect-ratio:3/4;max-width:460px;width:100%;border-radius:16px;overflow:hidden;background:var(--surface-2);user-select:none;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .after{clip-path:inset(0 0 0 50%)}
.cmp .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.cmp .handle::after{content:"";position:absolute;top:50%;left:50%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:var(--shadow)}
.cmp input{position:absolute;inset:0;width:100%;opacity:0;cursor:ew-resize}
.cmp .tag{position:absolute;top:10px;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;font-family:var(--f-mono)}

/* routine */
.step{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.step input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.step.done .lbl{text-decoration:line-through;color:var(--muted)}
.step .lbl{flex:1;min-width:0}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--line-2)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item::before{content:"";position:absolute;left:-20px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-item[data-cat="hair"]::before{border-color:var(--green)} .tl-item[data-cat="product"]::before{border-color:var(--amber)} .tl-item[data-cat="reaction"]::before{border-color:var(--red)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px}
.msg{max-width:min(78ch,92%);padding:12px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg-actions{display:flex;gap:4px;margin-top:8px}
.composer{display:flex;gap:8px;position:sticky;bottom:0;padding:12px 0;background:var(--bg)}
@media (max-width:860px){.composer{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
.composer textarea{min-height:46px;height:46px;border-radius:24px;padding:12px 16px}

/* modal / toast / panel */
.scrim{position:fixed;inset:0;background:rgba(8,28,40,.5);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{max-width:860px}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;box-shadow:var(--shadow);animation:rise .2s}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.sheet{position:fixed;right:16px;top:70px;z-index:40;width:min(360px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;max-height:70vh;overflow:auto}

/* onboarding */
.ob{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.ob-steps{display:flex;gap:6px;margin:18px 0 26px}
.ob-steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.ob-steps i.on{background:var(--accent)}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.choice{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:500}

@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(2.6rem,7vw,4.2rem);line-height:.98}

.chart svg{width:100%;height:auto;display:block}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.brand-btn{border:0;background:none;padding:0 8px 18px;cursor:pointer;color:inherit}
.m-brand{display:none;border:0;background:none;padding:0;cursor:pointer}
@media (max-width:860px){.m-brand{display:block}}
#main:focus{outline:none}
.logo-badge{background:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 40px -10px rgba(0,40,45,.45)}
.pattern{background:var(--band);color:var(--band-ink)}
.clinic-strip{border-left:4px solid var(--blue)}
.chip svg{width:13px;height:13px}
.ai-note svg,p>svg{width:16px;height:16px;vertical-align:-3px}
.ph-img{display:block;width:100%;height:100%;object-fit:cover;background:linear-gradient(135deg,var(--band),var(--blue))}
.ph-img.broken{object-fit:contain;padding:18%;background:linear-gradient(135deg,var(--band),var(--blue))}
.p-hero>.bg img.broken,.quote-band .bg img.broken,.cta-photo .im img.broken,.help-band .im img.broken{display:none}

/* ===== public site ===== */
.site{min-height:100%;display:flex;flex-direction:column;background:var(--surface)}
.site a{color:var(--accent)}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,32px)}
.ann{background:var(--band-2);color:#fff;font-size:.82rem}
.ann .wrap{display:flex;gap:12px;align-items:center;justify-content:center;padding-block:7px;flex-wrap:wrap;text-align:center}
.ann button{background:none;border:0;color:#9FE7BE;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* header sits on the photo hero, as in the reference */
.s-head{position:relative;z-index:5;color:#fff}
.s-head .wrap{display:flex;align-items:center;gap:18px;padding-block:14px;max-width:1400px}
.s-head.solid{background:var(--band)}
.s-nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.s-nav button{border:0;background:none;padding:8px 11px;font-weight:600;font-size:.84rem;color:rgba(255,255,255,.92);cursor:pointer;white-space:nowrap;font-family:var(--f-display);position:relative}
.s-nav button:hover{color:#fff}
.s-nav button[aria-current="page"]{color:#fff}
.s-nav button[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:2px;border-radius:2px;background:var(--green)}
.s-cta{display:flex;gap:8px;align-items:center}
.s-cta .btn{white-space:nowrap}
.s-cta .portal-link{background:none;border:0;color:#fff;font-weight:600;font-size:.84rem;cursor:pointer;display:flex;gap:6px;align-items:center;padding:6px 8px;font-family:var(--f-display)}
.s-cta .portal-link svg{width:16px;height:16px}
.burger{display:none;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
@media (max-width:1180px){.s-nav{display:none}.burger{display:grid;margin-left:auto}}
@media (max-width:640px){.s-cta .hide-m{display:none}.s-cta .btn.green{padding:7px 12px;font-size:.78rem}}
@media (max-width:420px){.s-head .lockup small{display:none}}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{filter:brightness(1.06)}
.btn.white{background:#fff;border-color:#fff;color:var(--band)}
.btn.outline-w{background:transparent;border-color:rgba(255,255,255,.85);color:#fff}
.btn.lg{padding:12px 24px;font-size:.95rem}
.site .btn{font-family:var(--f-display);font-weight:600}
.m-menu{position:fixed;inset:0;z-index:45;background:var(--surface);color:var(--fg);overflow:auto;padding:16px;animation:fade .15s}
.m-menu nav{display:flex;flex-direction:column;margin-top:14px}
.m-menu nav button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:15px 4px;font-weight:700;font-size:1.05rem;color:var(--heading);cursor:pointer;font-family:var(--f-display)}
main.s-main{flex:1;padding:0}

/* photo heroes */
.p-hero{position:relative;color:#fff;background:var(--band);overflow:hidden;isolation:isolate}
.p-hero>.bg{position:absolute;inset:0;z-index:-2}
.p-hero>.bg img{width:100%;height:100%;object-fit:cover;object-position:70% 30%}
.p-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--hero-fade) 0%,rgba(23,72,78,.82) 38%,rgba(23,72,78,.25) 70%,rgba(23,72,78,.05) 100%)}
.p-hero .hero-in{padding-block:clamp(34px,5vw,64px) clamp(40px,6vw,72px)}
.p-hero h1{color:#fff;font-size:clamp(2rem,4vw,2.9rem);font-weight:700;letter-spacing:-.01em}
.p-hero p.sub{color:rgba(255,255,255,.92);max-width:52ch;margin-top:10px;font-size:1.04rem}
.crumbs{display:flex;gap:6px;font-size:.8rem;color:rgba(255,255,255,.8);margin-top:14px;flex-wrap:wrap}
.crumbs button{background:none;border:0;color:inherit;cursor:pointer;padding:0}
.crumbs button:hover{text-decoration:underline}
@media (max-width:760px){.p-hero::before{background:linear-gradient(180deg,rgba(23,72,78,.78),var(--hero-fade))}}

.home-hero .hero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);padding-block:clamp(30px,5vw,60px) clamp(54px,8vw,110px)}
.home-hero .big-logo{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:22px}
.home-hero .big-logo .mark{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center}
.home-hero .big-logo .mark img{height:56px;width:auto}
.home-hero .big-logo b{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,5.4vw,3.8rem);letter-spacing:.04em;line-height:1}
.home-hero .big-logo small{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;opacity:.9}
.home-hero h1{font-size:clamp(1.7rem,3.4vw,2.5rem);text-transform:uppercase;font-weight:800;letter-spacing:.01em}
.home-hero p.sub{font-size:1.05rem}
.home-hero .row{margin-top:24px}
@media (max-width:860px){.home-hero .hero-in{grid-template-columns:minmax(0,1fr)}}

.sec{padding-block:clamp(40px,6vw,72px)}
.sec.tint{background:var(--surface-2)}
.sec.tight{padding-block:clamp(26px,4vw,44px)}
.eyebrow{font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep);font-family:var(--f-display)}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-h h2{font-size:clamp(1.3rem,2.4vw,1.7rem);font-weight:700;color:var(--heading)}
.sec-h p{max-width:62ch;color:var(--muted);margin-top:6px}
.link-more{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:.84rem;display:inline-flex;gap:6px;align-items:center;font-family:var(--f-display)}
.link-more svg{width:15px;height:15px}

/* highlights row */
.hl-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;text-align:center}
.hl-row>div{display:grid;justify-items:center;gap:6px;padding:8px}
.hl-row .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--accent);border:1.5px solid var(--sage)}
.hl-row .ic svg{width:24px;height:24px}
.hl-row b{font-family:var(--f-display);font-size:.92rem;color:var(--heading)}
.hl-row span{font-size:.84rem;color:var(--muted)}
@media (max-width:760px){.hl-row{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* photo cards */
.pc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:980px){.pc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.pc-grid{grid-template-columns:minmax(0,1fr)}}
.pcard{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;color:var(--fg);padding:0;box-shadow:0 2px 10px -6px rgba(15,50,55,.25);transition:transform .15s,box-shadow .15s;min-width:0}
.pcard:hover{transform:translateY(-3px);box-shadow:0 14px 28px -16px rgba(15,50,55,.45)}
.pcard .im{aspect-ratio:4/3;overflow:hidden;background:var(--surface-2)}
.pcard .bd{padding:14px 16px 16px;display:grid;gap:6px;flex:1;align-content:start}
.pcard h3{font-size:.95rem;font-weight:700;color:var(--heading)}
.pcard p{font-size:.84rem;color:var(--muted)}
.pcard .more{font-size:.8rem;font-weight:700;color:var(--green-deep);margin-top:4px;font-family:var(--f-display)}
.svc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}

/* CTA bands with photos */
.cta-photo{position:relative;border-radius:14px;overflow:hidden;background:var(--band);color:#fff;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:220px;isolation:isolate}
.cta-photo .im{position:relative}
.cta-photo .im::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,var(--band))}
.cta-photo .tx{padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;justify-content:center;gap:10px}
.cta-photo h2{color:#fff;font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:700}
.cta-photo p{color:rgba(255,255,255,.9);max-width:46ch}
.cta-photo .btn{align-self:flex-start;margin-top:6px}
@media (max-width:700px){.cta-photo{grid-template-columns:minmax(0,1fr)}.cta-photo .im{height:200px}.cta-photo .im::after{background:linear-gradient(180deg,transparent 40%,var(--band))}}
.cta-strip{border-radius:12px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--band);color:#fff}
.cta-strip h3{color:#fff;font-size:1.12rem}
.cta-strip p{color:rgba(255,255,255,.85);font-size:.9rem;margin-top:4px}
.quote-band{position:relative;border-radius:14px;overflow:hidden;min-height:250px;display:grid;place-items:center;text-align:center;color:#fff;isolation:isolate;padding:30px 20px}
.quote-band .bg{position:absolute;inset:0;z-index:-2}
.quote-band::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(23,72,78,.55),rgba(23,72,78,.85) 50%,rgba(23,72,78,.55))}
.quote-band q{display:block;font-family:var(--f-display);font-size:clamp(1.3rem,2.8vw,1.9rem);font-weight:600;quotes:none;max-width:24ch;margin:10px auto 8px}
.quote-band svg{width:28px;height:28px;color:#9FE7BE}

/* about */
.story{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(22px,4vw,46px);align-items:center}
.story .im{border-radius:12px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 18px 40px -24px rgba(15,50,55,.6)}
.story h2{font-size:1.5rem;margin-bottom:12px}
.story p{color:var(--muted);margin-bottom:12px;line-height:1.7}
@media (max-width:820px){.story{grid-template-columns:minmax(0,1fr)}}
.values{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;text-align:center}
.values>div{display:grid;justify-items:center;gap:6px}
.values .ic{width:54px;height:54px;border-radius:50%;background:var(--sage-soft);color:var(--accent);display:grid;place-items:center}
.values .ic svg{width:24px;height:24px}
.values b{font-family:var(--f-display);color:var(--heading)}
.values span{font-size:.84rem;color:var(--muted)}
@media (max-width:700px){.values{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* gallery */
.ba-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.ba-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.ba-grid{grid-template-columns:minmax(0,1fr)}}
.ba{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.ba .pair{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:2/1.15;position:relative}
.ba .pair img{width:100%;height:100%;object-fit:cover}
.ba .pair::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff}
.ba .bd{padding:10px 14px;display:flex;justify-content:space-between;gap:8px;font-size:.84rem}
.ba .bd b{color:var(--heading);font-family:var(--f-display)}
.ba-empty{border:1.5px dashed var(--line-2);border-radius:12px;padding:30px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--surface)}
.ba-empty .ic{width:56px;height:56px;border-radius:50%;background:var(--sage-soft);color:var(--accent);display:grid;place-items:center}
@media (max-width:560px){.ba-empty{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:0;padding:0;background:var(--surface);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;box-shadow:0 2px 10px -6px rgba(15,50,55,.3);color:var(--fg)}
.tile .im{aspect-ratio:4/3}
.tile span{display:flex;justify-content:space-between;padding:10px 12px;font-weight:600;font-size:.84rem;font-family:var(--f-display);color:var(--heading)}
.tile svg{width:15px;height:15px}
.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:12px;margin-bottom:22px}
@media (max-width:700px){.filters{grid-template-columns:minmax(0,1fr)}}

/* blog */
.blog{display:grid;grid-template-columns:240px minmax(0,1fr);gap:clamp(20px,4vw,40px);align-items:start}
@media (max-width:820px){.blog{grid-template-columns:minmax(0,1fr)}}
.cats h3{font-size:1rem;margin-bottom:12px}
.cats button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 6px;border-radius:8px;cursor:pointer;color:var(--fg);font-size:.9rem;text-align:left}
.cats button svg{width:17px;height:17px;color:var(--accent);flex:none}
.cats button[aria-pressed="true"]{background:var(--sage-soft);font-weight:700}
.cats button em{margin-left:auto;font-style:normal;color:var(--muted);font-size:.78rem}
@media (max-width:820px){.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.cats h3{display:none}.cats button{width:auto;white-space:nowrap;border:1px solid var(--line)}}
.post{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;width:100%;text-align:left;color:var(--fg)}
.post:hover{border-color:var(--accent)}
.post .im{aspect-ratio:4/3;border-radius:8px;overflow:hidden}
.post h3{font-size:.98rem;color:var(--heading)}
.post .meta{font-size:.78rem;color:var(--muted);margin-top:4px}
.post>svg{width:18px;height:18px;color:var(--accent)}
@media (max-width:520px){.post{grid-template-columns:88px minmax(0,1fr)}.post>svg{display:none}}

/* contact */
.contact-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(22px,4vw,44px);align-items:start}
@media (max-width:860px){.contact-grid{grid-template-columns:minmax(0,1fr)}}
.ci{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:12px 0}
.ci .ic{width:44px;height:44px;border-radius:50%;background:var(--sage-soft);color:var(--accent);display:grid;place-items:center}
.ci .ic svg{width:20px;height:20px}
.ci b{font-family:var(--f-display);color:var(--heading);display:block;margin-bottom:2px}
.ci p{font-size:.9rem;color:var(--muted)}
.map-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:stretch;margin-top:28px}
@media (max-width:760px){.map-row{grid-template-columns:minmax(0,1fr)}}
.map{border-radius:12px;overflow:hidden;border:1px solid var(--line);min-height:260px;background:var(--surface-2)}
.map iframe{width:100%;height:100%;min-height:260px;border:0;display:block}

/* booking page */
.book-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,3vw,32px);align-items:start}
@media (max-width:860px){.book-grid{grid-template-columns:minmax(0,1fr)}}
.why-list{display:grid;gap:10px;margin-top:12px}
.why-list div{display:flex;gap:10px;align-items:center;font-size:.92rem}
.why-list svg{width:20px;height:20px;color:#fff;background:var(--green);border-radius:50%;padding:3px;flex:none}
.qb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.qb{grid-template-columns:minmax(0,1fr)}}
.qb .card{display:grid;gap:8px;align-content:start}
.qb .ic{width:44px;height:44px;border-radius:50%;background:var(--sage-soft);color:var(--accent);display:grid;place-items:center}
.qb .ic svg{width:22px;height:22px}
.help-band{border-radius:12px;overflow:hidden;background:var(--band);color:#fff;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:20px;align-items:center;padding-right:24px}
.help-band .im{height:120px}
.help-band h3{color:#fff}
.help-band p{color:rgba(255,255,255,.85);font-size:.9rem;margin-top:4px}
@media (max-width:640px){.help-band{grid-template-columns:minmax(0,1fr);padding:0 0 20px}.help-band .im{height:150px}.help-band>div,.help-band>.btn{margin-inline:20px}}

/* existing components, restyled */
.ai-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.ai-split{grid-template-columns:minmax(0,1fr)}}
.ai-panel{border-radius:14px;padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;min-width:0}
.ai-panel.skin{background:var(--band);color:#fff}
.ai-panel.hair{background:var(--green-deep);color:#fff}
.ai-panel h3{color:#fff;font-size:1.3rem}
.ai-panel ul{margin:0;padding-left:18px;display:grid;gap:6px}
.ai-panel .scan-line{position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;border:2px dashed rgba(255,255,255,.3)}
.ai-panel .eyebrow{color:#9FE7BE}
.ai-note{margin-top:16px;font-size:.88rem;color:var(--muted);max-width:80ch}
.camp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.camp{border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;min-height:240px;min-width:0;background:var(--band) linear-gradient(135deg,var(--band),var(--blue))}
.camp h3{color:#fff;font-size:1.3rem;text-transform:uppercase;line-height:1.1}
.camp p{color:rgba(255,255,255,.92)}
.camp .tagc{align-self:flex-start;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.contact-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:10px;margin-top:auto;background:#fff;color:#173F45;font-size:.72rem;overflow:hidden}
.contact-strip div{padding:6px 8px;border-left:1px solid #D5E5E5;min-width:0;overflow-wrap:anywhere}
.contact-strip div:first-child{border-left:0}
.contact-strip b{display:block;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.person .ph{aspect-ratio:1;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.person .ph img{width:100%;height:100%;object-fit:cover}
.person .bd{padding:16px;display:grid;gap:4px}
.art-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:980px){.art-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.art-grid{grid-template-columns:minmax(0,1fr)}}
.art{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;color:var(--fg);min-width:0;overflow:hidden}

.art .bd{padding:14px 16px;display:grid;gap:6px}
.art:hover{border-color:var(--accent)}
.art .cat{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green-deep)}
.art h3{font-size:.98rem}
.two-col{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.two-col{grid-template-columns:minmax(0,1fr)}}
.side-card{position:sticky;top:20px}
.prose{max-width:70ch}
.prose p{margin:0 0 14px;font-size:1rem;line-height:1.7}
.prose h2{margin:26px 0 10px;font-size:1.25rem}
.prose ul{margin:0 0 14px;padding-left:20px;display:grid;gap:6px}
.svc-hero-img{border-radius:12px;overflow:hidden;aspect-ratio:16/8;margin-bottom:22px}

/* footer */
.s-foot{background:var(--footer);color:var(--footer-ink);margin-top:auto}
.s-foot .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:28px;padding-block:40px 30px}

      const r = await fetch("content.json", { cache: "no-cache" }); if (!r.ok) return;

function audit(action, detail = "") {
  const who = Staff.session ? `${Staff.session.name} (${Staff.session.role})` : "system";
  Clinic.ops.audit.unshift({ id: uid(), at: nowISO(), who, action, detail });

/* ---------- Backend: Supabase when configured, otherwise this device ---------- */
const Backend = {
  sb: null, user: null, ready: false, error: null,
  get configured() { return !!(CONFIG.supabase.url && CONFIG.supabase.anonKey); },
  async init() {
    if (!this.configured) { this.ready = true; return; }
    try {
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js");
      this.sb = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
      const { data } = await this.sb.auth.getSession(); this.user = data.session?.user || null;
      this.sb.auth.onAuthStateChange((_e, session) => { this.user = session?.user || null; Store.onAuth(); render(); });
      const { data: row } = await this.sb.from("clinic_content").select("json").eq("id", 1).maybeSingle();
      if (row?.json?.version === 1) { Object.assign(Clinic.c, row.json); Clinic.syncArticles(); }
    } catch (e) { this.error = "Couldn't reach the clinic's secure database. Check your connection."; this.sb = null; }
    this.ready = true; render();
  },
  async signIn(email, password) { const { error } = await this.sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
  async signUp(email, password, name) { const { data, error } = await this.sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + location.pathname + "#app" } }); if (error) throw error; return data; },
  async reset(email) { const { error } = await this.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname + "#app" }); if (error) throw error; },
  async signOut() { await this.sb.auth.signOut(); },
  /* patient record documents (same shape as the claude.ai db refs the Store already uses) */
  doc(key) {
    const sb = this.sb, uidv = () => this.user.id;
    return {
      async get() { const { data, error } = await sb.from("patient_docs").select("data").eq("user_id", uidv()).eq("key", key).maybeSingle(); if (error) throw error; return { exists: !!data, data: () => data?.data }; },
      async set(v) { const { error } = await sb.from("patient_docs").upsert({ user_id: uidv(), key, data: v, updated_at: nowISO() }); if (error) throw error; },
      async delete() { const { error } = await sb.from("patient_docs").delete().eq("user_id", uidv()).eq("key", key); if (error) throw error; }
    };
  },
  async insert(table, row) { // id made here so visitors without read access (e.g. guest bookings) can still insert
    row = { id: crypto.randomUUID(), ...row }; const { error } = await this.sb.from(table).insert(row); if (error) throw error; return row; },
  async update(table, id, patch) { const { error } = await this.sb.from(table).update(patch).eq("id", id); if (error) throw error; },
  async saveContent(c) { try { const { error } = await this.sb.from("clinic_content").upsert({ id: 1, json: c, updated_at: nowISO() }); if (error) throw error; toast("Published for everyone"); } catch (e) { toast("Saved here, but publishing failed: " + (e.message || "permission denied")); } },
  async pullOps() { // staff: bookings, enquiries, plans, notes the signed-in role may read (RLS decides)
    const t = async (n) => { const { data } = await this.sb.from(n).select("*").order("created_at", { ascending: false }).limit(500); return (data || []).map(r => r.json ? { ...r.json, id: r.id } : r); };
    const [b, e, p, n, a] = await Promise.all([t("bookings"), t("enquiries"), t("care_plans"), t("clinical_notes"), t("audit_events")]);
    Object.assign(Clinic.ops, { bookings: b, enquiries: e, carePlans: p, notes: n, audit: a.map(x => ({ id: x.id, at: x.created_at, who: x.actor_name, action: x.action, detail: x.detail })) });
  }
};
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("script")); document.head.append(s); }); }

/* Server AI bridge for hosting outside claude.ai. Same call shape as claude.ai's `sample`. */
async function serverAI() {
  if (!/^https?:/.test(location.protocol) || !CONFIG.aiEndpoint) return null;
  try { const r = await fetch(CONFIG.aiEndpoint, { method: "GET" }); if (!r.ok) return null; const j = await r.json(); if (!j.configured) return null; } catch (e) { return null; }
  const toB64 = b => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(",")[1]); f.onerror = rej; f.readAsDataURL(b); });
  const call = async (input, opts = {}) => {
    const images = []; for (const b of opts.images || []) images.push({ media_type: b.type || "image/jpeg", data: await toB64(b) });
    let r;
    try { r = await fetch(CONFIG.aiEndpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ input, images }), signal: opts.signal }); }
    catch (e) { if (e.name === "AbortError") throw { code: "cancelled" }; throw { code: "network", message: "The AI service couldn't be reached. Check your connection." }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: j.code || (r.status === 429 ? "rate_limited" : "provider_error"), message: j.message };
    opts.onText?.({ text: j.text, delta: j.text }); return { text: j.text, truncated: !!j.truncated };
  };
  const fn = (input, opts) => call(input, opts);
  fn.json = async (input, opts) => { const { text } = await call(input, opts); try { return JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, "").trim()); } catch (e) { throw { code: "invalid_json" }; } };
  fn.limits = async () => ({ images: true });
  return fn;

   Photos are stored as separate small JPEG records, never inside the main state document. */
const freshState = () => ({
  version: 1, onboarded: false, example: false, createdAt: nowISO(), patientId: uid(),
  profile: { name: "", ageRange: "", country: "", units: "metric", goals: [] },
  consent: { photos: false, ai: false, coachContext: true, history: [] },
  skin: { type: "", sensitivity: "", tendency: "", dehydration: "", allergies: "", concerns: [], goals: "", preferred: "", notes: "", src: {}, regionNotes: {}, history: [] },
  hair: { curl: "", curlDetail: "", porosity: "", density: "", thickness: "", elasticity: "", length: "", desiredLength: "", shrinkage: "",
    scalp: { type: "", oiliness: "", dryness: "", flaking: "", itch: "", sensitivity: "", buildup: "", notes: "" },
    chemical: "", colour: "", heat: "", washFreq: "", protective: "", detangling: "", concerns: [], goals: "", notes: "", src: {}, lengths: [], history: [] },
  assessments: [], routines: [], completions: {}, products: [], reactions: [], journal: [], questions: [], styles: [], appointments: [],
  chat: [], aiFeedback: [], savedArticles: [], readNotifs: [],

const Store = {
  mode: "local", state: freshState(), db: null, uid: null, saving: false, pending: false, timer: null, lastError: null,
  LS: "radiance:v1",
  loadLocal() {
    try { const raw = localStorage.getItem(this.LS); if (raw) this.state = Object.assign(freshState(), JSON.parse(raw)); } catch (e) { /* storage blocked */ }
  },
  async connectCloud() { // claude.ai private store (when this page runs as a claude.ai artifact)
    if (!window.claude?.use || Backend.configured) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.db = db; this.uid = id; await this.attach("cloud");
    } catch (e) { this.lastError = e?.code || "unavailable"; render(); }
  },
  async onAuth() { // Supabase account signed in or out
    if (!Backend.user) { this.mode = "local"; return; }
    try { await this.attach("account"); } catch (e) { this.lastError = "unavailable"; toast("Couldn't load your records. Check your connection."); }
  },
  async attach(mode) {
    const snap = await this.ref("state").get();
    const cloud = snap.exists ? snap.data() : null;
    if (cloud && cloud.json) this.state = Object.assign(freshState(), JSON.parse(cloud.json));
    else if (this.state.onboarded && !this.state.example) { // first sign-in: move this device's records into the account
      await this.ref("state").set({ json: JSON.stringify(this.state), updatedAt: nowISO() });
      for (const a of this.state.assessments) for (const pid of a.photoIds || []) { const d = this.localPhoto(pid); if (d) await this.ref("photo_" + pid).set({ dataUrl: d, at: a.at }); }
    } else this.state = freshState();
    if (Backend.user) { this.state.patientId = Backend.user.id; if (!this.state.profile.name) this.state.profile.name = Backend.user.user_metadata?.name || ""; }
    this.mode = "cloud"; render();
  },
  ref(key) { return Backend.sb && Backend.user ? Backend.doc(key) : this.db.collection("data/users/" + this.uid).doc(key); },
  save() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 450); },
  async flush() {
    const json = JSON.stringify(this.state);
    try { localStorage.setItem(this.LS, json); } catch (e) {}
    if (this.mode !== "cloud") return;
    if (this.saving) { this.pending = true; return; }
    this.saving = true;
    try {
      if (json.length > 240000) { toast("Your record is near the storage limit. Export a backup and clear old chat history."); }
      await this.ref("state").set({ json, updatedAt: nowISO() }); this.lastError = null;
    } catch (e) { this.lastError = e?.code || "write_failed"; toast("Couldn't save to your private store. Your changes are kept in this browser for now."); }
    this.saving = false;
    if (this.pending) { this.pending = false; this.flush(); }
  },
  localPhoto(id) { try { return localStorage.getItem("radiance:photo:" + id); } catch (e) { return null; } },
  async putPhoto(id, dataUrl, at) {
    if (this.mode === "cloud") { await this.ref("photo_" + id).set({ dataUrl, at }); return; }
    try { localStorage.setItem("radiance:photo:" + id, dataUrl); }
    catch (e) { const err = new Error("Browser storage is full. Export your data and delete older photos."); err.code = "quota"; throw err; }
  },
  photoCache: {},
  async getPhoto(id) {
    if (this.photoCache[id]) return this.photoCache[id];
    let d = null;
    if (this.mode === "cloud") { try { const s = await this.ref("photo_" + id).get(); d = s.exists ? s.data().dataUrl : null; } catch (e) {} }
    if (!d) d = this.localPhoto(id);
    if (d) this.photoCache[id] = d; return d;
  },
  async deletePhoto(id) {
    delete this.photoCache[id];
    try { localStorage.removeItem("radiance:photo:" + id); } catch (e) {}
    if (this.mode === "cloud") { try { await this.ref("photo_" + id).delete(); } catch (e) {} }
  },
  async wipe() {
    for (const a of this.state.assessments) for (const p of a.photoIds || []) await this.deletePhoto(p);
    try { Object.keys(localStorage).filter(k => k.startsWith("radiance:photo:") || k === this.LS).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    if (this.mode === "cloud") await this.ref("state").delete();
    const keepId = Backend.user?.id;
    this.state = freshState(); if (keepId) this.state.patientId = keepId;
  }
};

async function saveFile(filename, data) {
  if (!window.claude) { // ordinary website: a normal browser download works
    try { const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".json") ? "application/json" : "text/html" })); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Downloading " + filename); return; } catch (e) {}

  const out = [], s = S(), t = dayKey();
  s.products.forEach(p => {
    if (p.expiresAt && p.status !== "Finished") { const d = daysBetween(t, p.expiresAt);
      if (d <= 30) out.push({ id: `exp-${p.id}-${p.expiresAt}`, text: d < 0 ? `${p.name} passed its expiry date (${fmtDate(p.expiresAt)})` : `${p.name} expires ${fmtDate(p.expiresAt)}`, page: "studio", tab: "products" }); }
  });
  s.styles.filter(st => !st.removedAt && st.removeBy).forEach(st => { const d = daysBetween(t, st.removeBy);
    if (d <= 7) out.push({ id: `sty-${st.id}`, text: d < 0 ? `${st.style}: planned removal date has passed` : `${st.style}: planned removal in ${d} day${d === 1 ? "" : "s"}`, page: "studio", tab: "styles" }); });
  todaysRoutines().filter(r => r.area === "hair" && r.type === "Wash day").forEach(r => out.push({ id: `wash-${r.id}-${t}`, text: `Wash day today: ${r.name}`, page: "studio", tab: "routines" }));

const TRACKED = /^(skin|hair)\.(?!history|regionNotes|lengths|src)/;
function trackChange(path, from, to) {
  if (!S().onboarded || !TRACKED.test(path)) return;
  const area = path.split(".")[0]; const h = S()[area].history;
  const field = path.split(".").slice(1).join(".");
  if (JSON.stringify(from) === JSON.stringify(to)) return;
  S()[area].src[field] = S()[area].src[field] === "ai" || S()[area].src[field] === "clinician" ? "self" : (S()[area].src[field] || "self");
  h.unshift({ at: nowISO(), field, from: Array.isArray(from) ? from.join(", ") : from, to: Array.isArray(to) ? to.join(", ") : to });
  h.length = Math.min(h.length, 120);
}

  return `<div class="row" style="gap:6px">${opts.map(o => { const on = multi ? (cur || []).includes(o) : cur === o;
    return `<button type="button" class="chip toggle-chip" aria-pressed="${on}" data-a="pick" data-path="${path}" data-val="${esc(o)}" ${multi ? 'data-multi="1"' : ""}>${esc(o)}</button>`; }).join("")}</div>`;
};
const sel = (path, opts, label, hint = "", rerender = true) => {
  const cur = getPath(S(), path) || ""; const id = "f-" + path.replace(/\./g, "-");
  return `<label class="field" for="${id}"><span>${label}</span><select id="${id}" data-bind="${path}" ${rerender ? 'data-rerender="1"' : ""}><option value="">Not recorded</option>${opts.map(o => `<option ${o === cur ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>${hint ? `<small>${hint}</small>` : ""}</label>`;
};
const txt = (path, label, hint = "", ph = "", area = false) => {
  const cur = getPath(S(), path) ?? ""; const id = "f-" + path.replace(/\./g, "-");
  return `<label class="field" for="${id}"><span>${label}</span>${area ? `<textarea id="${id}" data-bind="${path}" placeholder="${esc(ph)}">${esc(cur)}</textarea>` : `<input type="text" id="${id}" data-bind="${path}" value="${esc(cur)}" placeholder="${esc(ph)}">`}${hint ? `<small>${hint}</small>` : ""}</label>`;
};
const pageHead = (eyebrow, title, sub = "", right = "") => `<div class="page-h"><div><div class="label">${eyebrow}</div><h1>${title}</h1>${sub ? `<p class="muted">${sub}</p>` : ""}</div>${right ? `<div class="row">${right}</div>` : ""}</div>`;
const tabs = (list, cur) => `<div class="tabs" role="tablist">${list.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${cur === k}" data-a="tab" data-tab="${k}">${l}</button>`).join("")}</div>`;
const emptyBox = (msg, btn = "") => `<div class="empty">${msg}${btn}</div>`;

/* ---------- 6. Onboarding ---------- */
let obStep = 0;
const OB_TOTAL = 5;

  const nav = (next = "Continue", skip = true) => `<div class="spread" style="margin-top:28px"><button class="btn ghost" data-a="obBack">Back</button><div class="row">${skip ? `<button class="btn ghost" data-a="obNext">Skip for now</button>` : ""}<button class="btn primary" data-a="obNext">${next}</button></div></div>`;
  let body = "";
  if (obStep === 0) {
    return `<div class="ob" style="max-width:1040px">
      <div class="spread" style="padding:0 0 30px"><button class="brand brand-btn" data-a="site" data-path="">${brandLockup("Patient portal")}</button><button class="btn sm ghost" data-a="site" data-path="">Back to website</button></div>
      <div class="hero">
        <div class="stack" style="gap:18px">
          <h1>Your skin and hair, <em>between visits.</em></h1>
          <p class="muted" style="font-size:1.08rem;max-width:52ch">Build your skin and hair profile once, take guided photos with quality checks, follow your care plan from the RADIANCE team, and arrive at each appointment with a clear history.</p>
          <div class="row"><button class="btn primary" data-a="obStart">Set up my profile</button><button class="btn" data-a="obExample">Explore with example data</button></div>
          <p class="muted small" style="max-width:56ch">${ic("info", "")} AI photo observations describe what's visible in a picture. They don't diagnose conditions and don't replace an examination by a RADIANCE clinician.</p>

        </div>
        <div class="specimen" aria-hidden="true">
          <div class="idcard"><div class="spread"><span class="label">Skin ID</span><span class="code">SKN · 0001</span></div>
            <dl class="kv" style="margin-top:12px"><dt>Type</dt><dd>Combination ${srcChip("self")}</dd><dt>Sensitivity</dt><dd>Somewhat sensitive</dd><dt>Watching</dt><dd>Dark spots, texture</dd></dl></div>
          <div class="idcard"><div class="spread"><span class="label">Hair ID</span><span class="code">HR · 0001</span></div>
            <dl class="kv" style="margin-top:12px"><dt>Pattern</dt><dd>Coily</dd><dt>Porosity</dt><dd>High ${srcChip("questionnaire")}</dd><dt>Density</dt><dd>Medium</dd></dl></div>
          <p class="mono muted">Illustration of the profiles you'll build</p>
        </div>
      </div></div>`;
  }
  if (obStep === 1) body = `<h2>About you</h2><p class="muted" style="margin-top:6px">Everything here is optional and can be changed later.</p>
    <div class="grid g2" style="margin-top:20px">${txt("profile.name", "What should we call you?", "", "First name or nickname")}${sel("profile.ageRange", OPT.ageRange, "Age range", "Used only to tailor general guidance.", false)}${txt("profile.country", "Country", "Helps with time zones and sun-protection guidance.", "e.g. Sierra Leone")}</div>
    <div class="field" style="margin-top:18px"><span>What would you like help with?</span>${chipsPick("profile.goals", OPT.goals)}</div>`;
  if (obStep === 2) body = `<h2>Your skin, as you see it</h2><p class="muted" style="margin-top:6px">These are recorded as <b>self-reported</b>. Type, sensitivity and allergies are different things, so each gets its own answer.</p>
    <div class="stack" style="margin-top:20px;gap:18px">
      <div class="field"><span>Skin type</span>${choices("skin.type", OPT.skinType)}</div>
      <div class="field"><span>Sensitivity</span>${choices("skin.sensitivity", OPT.sensitivity)}</div>
      <div class="field"><span>Main concerns</span>${chipsPick("skin.concerns", OPT.skinConcerns)}</div>
      ${txt("skin.allergies", "Known ingredient allergies or sensitivities", "Separate with commas. Used to flag products in your inventory.", "e.g. fragrance, lanolin")}
    </div>`;
  if (obStep === 3) body = `<h2>Your hair and scalp</h2><p class="muted" style="margin-top:6px">Pick "Not sure" freely. Porosity in particular is hard to know without a guided check, and you can do that later in Hair Lab.</p>
    <div class="stack" style="margin-top:20px;gap:18px">
      <div class="field"><span>Curl pattern</span>${choices("hair.curl", OPT.curl)}</div>
      <div class="grid g3">${sel("hair.porosity", OPT.porosity, "Porosity", "", false)}${sel("hair.density", OPT.density, "Density", "How much hair overall", false)}${sel("hair.thickness", OPT.thickness, "Strand thickness", "Width of a single strand", false)}</div>
      <div class="grid g3">${sel("hair.scalp.type", OPT.scalp, "Scalp type", "", false)}${sel("hair.washFreq", OPT.washFreq, "Wash frequency", "", false)}${sel("hair.chemical", OPT.chemical, "Chemical treatments", "", false)}</div>
      <div class="field"><span>Main concerns</span>${chipsPick("hair.concerns", OPT.hairConcerns)}</div>
    </div>`;
  if (obStep === 4) body = `<h2>Photos and AI: your choice</h2><p class="muted" style="margin-top:6px">Nothing is captured or sent until you start a scan yourself.</p>
    <div class="stack" style="margin-top:20px">
      <label class="card row" style="align-items:flex-start;gap:14px;cursor:pointer"><input type="checkbox" data-bind="consent.photos" ${s.consent.photos ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--accent)"><div class="stack" style="gap:4px"><b>Store my photos with my records</b>
        <span class="muted small">Photos are downscaled and kept in ${Store.mode === "cloud" ? "your private store on claude.ai, readable only by your signed-in account" : "this browser's storage on this device"}. You can delete any photo, or everything, from Settings.</span></div></label>
      <label class="card row" style="align-items:flex-start;gap:14px;cursor:pointer"><input type="checkbox" data-bind="consent.ai" ${s.consent.ai ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--accent)"><div class="stack" style="gap:4px"><b>Allow AI photo analysis</b>

      <label class="card row" style="align-items:flex-start;gap:14px;cursor:pointer"><input type="checkbox" data-bind="consent.coachContext" ${s.consent.coachContext ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--accent)"><div class="stack" style="gap:4px"><b>Let the AI Coach read my Skin ID, Hair ID and products</b>

    </div>`;
  if (obStep === 5) body = `<h2>You're set${s.profile.name ? ", " + esc(s.profile.name) : ""}.</h2><p class="muted" style="margin-top:6px">Your dashboard is built from what you entered. No scans or scores are shown until you create them.</p>
    <div class="grid g2" style="margin-top:20px">
      <button class="card raised" data-a="obFinish" data-page="skin" data-tab="scan" style="text-align:left;cursor:pointer"><div class="label">Skin Lab</div><h3 style="margin-top:6px">Take a first face photo</h3><p class="muted small" style="margin-top:6px">Guided capture with lighting and focus checks.</p></button>
      <button class="card raised" data-a="obFinish" data-page="hair" data-tab="porosity" style="text-align:left;cursor:pointer"><div class="label">Hair Lab</div><h3 style="margin-top:6px">Check your porosity tendency</h3><p class="muted small" style="margin-top:6px">A short questionnaire, saved to your Hair ID.</p></button>
    </div>
    <div class="spread" style="margin-top:28px"><button class="btn ghost" data-a="obBack">Back</button><button class="btn primary" data-a="obFinish" data-page="home">Go to my dashboard</button></div>`;
  return `<div class="ob"><div class="brand" style="padding:0"><span class="brand-mark">${CONFIG.brand.mark}</span><b>${esc(CONFIG.brand.name)}</b></div>${steps}${body}${obStep < 5 ? nav(obStep === 4 ? "Save choices" : "Continue", obStep !== 4) : ""}</div>`;
}
Object.assign(ACTIONS, {
  obStart: () => { obStep = 1; render(); },
  obNext: () => { if (obStep === 4) { const c = S().consent; c.history.unshift({ at: nowISO(), photos: c.photos, ai: c.ai, coachContext: c.coachContext }); Store.save(); } obStep = Math.min(5, obStep + 1); render(); window.scrollTo(0, 0); },
  obBack: () => { obStep = Math.max(0, obStep - 1); render(); },
  obFinish: el => { S().onboarded = true; Store.save(); go(el.dataset.page || "home", el.dataset.tab || null); },
  obExample: () => { loadExample(); go("home"); }
});

/* ---------- 7. Dashboard ---------- */
function latest(kind) { return S().assessments.filter(a => a.kind === kind && a.saved && a.status === "completed").sort((a, b) => b.at.localeCompare(a.at))[0]; }
function val(v) { return v ? esc(v) : `<span class="muted">Not recorded</span>`; }

PAGES.home = () => {
  const s = S(), hid = s.settings.dashHidden, ls = latest("skin"), lh = latest("hair");
  const hour = new Date().getHours(); const greet = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const sec = (k, html) => hid.includes(k) ? "" : html;
  const todays = todaysRoutines(); const dk = dayKey(); const done = s.completions[dk] || {};
  const totalSteps = todays.reduce((n, r) => n + r.steps.length, 0); const doneSteps = todays.reduce((n, r) => n + r.steps.filter(st => done[r.id + ":" + st.id]).length, 0);
  return `
  <div class="page-h"><div><h1>${greet}${s.profile.name ? ", " + esc(s.profile.name.split(" ")[0]) : ""}.</h1>
    <p class="muted">${totalSteps ? `${doneSteps} of ${totalSteps} care steps done today.` : "No routines scheduled today."} ${s.assessments.filter(a => a.saved).length ? "" : "You haven't saved any photo assessments yet."}</p></div>
    <div class="row"><button class="btn" data-a="customiseDash">Customise</button><button class="btn primary" data-a="go" data-page="skin" data-tab="scan">${ic("camera")} New scan</button></div></div>
  ${sec("clinic", clinicDashCard())}
  <div class="grid g2">
    ${sec("skin", `<section class="card raised"><div class="card-h"><div><div class="label">Skin ID</div><h3 style="margin-top:4px">${s.skin.type ? esc(s.skin.type) + " skin" : "Skin profile"}</h3></div><button class="btn sm" data-a="go" data-page="skin">Open</button></div>
      <dl class="kv"><dt>Sensitivity</dt><dd>${val(s.skin.sensitivity)}</dd><dt>Concerns</dt><dd>${s.skin.concerns.length ? esc(s.skin.concerns.join(", ")) : val("")}</dd><dt>Avoiding</dt><dd>${val(s.skin.allergies)}</dd>
      <dt>Last scan</dt><dd>${ls ? fmtDate(ls.at) : val("")}</dd></dl>
      ${ls ? `<p class="small" style="margin-top:12px">${esc(ls.result.summary)}</p><div class="row" style="margin-top:12px"><button class="btn sm" data-a="go" data-page="skin" data-tab="history" data-id="${ls.id}">View assessment</button></div>`
        : `<div class="notice" style="margin-top:14px">${ic("camera")}<div>No face photos yet. A first photo gives you a baseline to compare against later. <button class="btn sm primary" data-a="go" data-page="skin" data-tab="scan" style="margin-top:8px">Start first scan</button></div></div>`}</section>`)}
    ${sec("hair", `<section class="card raised"><div class="card-h"><div><div class="label">Hair ID</div><h3 style="margin-top:4px">${s.hair.curl ? esc(s.hair.curl) + " hair" : "Hair profile"}</h3></div><button class="btn sm" data-a="go" data-page="hair">Open</button></div>
      <dl class="kv"><dt>Porosity</dt><dd>${val(s.hair.porosity)} ${s.hair.porosity ? srcChip(s.hair.src.porosity) : ""}</dd><dt>Density</dt><dd>${val(s.hair.density)}</dd><dt>Scalp</dt><dd>${val(s.hair.scalp.type)}</dd><dt>Goals</dt><dd>${val(s.hair.goals)}</dd>
      <dt>Last hair photo</dt><dd>${lh ? fmtDate(lh.at) : val("")}</dd></dl>
      <div class="row" style="margin-top:14px"><button class="btn sm" data-a="go" data-page="hair" data-tab="scan">Document hair or scalp</button>${!s.hair.porosity || s.hair.porosity === "Not sure" ? `<button class="btn sm" data-a="go" data-page="hair" data-tab="porosity">Porosity check</button>` : ""}</div></section>`)}
    ${sec("today", `<section class="card"><div class="card-h"><div><div class="label">Today's care</div><h3 style="margin-top:4px">${esc(new Date().toLocaleDateString(undefined, { weekday: "long" }))}</h3></div><button class="btn sm" data-a="go" data-page="studio" data-tab="routines">Routines</button></div>
      ${todays.length ? todays.map(r => `<div class="stack" style="gap:6px;margin-bottom:14px"><div class="spread"><b class="small">${esc(r.name)}</b><span class="chip">${r.steps.filter(st => done[r.id + ":" + st.id]).length}/${r.steps.length}</span></div>
        ${r.steps.map(st => stepRow(r, st, done)).join("")}</div>`).join("")
        : emptyBox("No routines scheduled for today.", `<button class="btn sm" data-a="go" data-page="studio" data-tab="routines">Create a routine</button>`)}
      <div class="row" style="margin-top:6px"><button class="btn sm ghost" data-a="newReaction">${ic("plus")} Log a reaction</button><button class="btn sm ghost" data-a="newJournal">${ic("plus")} Journal note</button></div></section>`)}
    ${sec("progress", `<section class="card"><div class="card-h"><div><div class="label">Recent activity</div><h3 style="margin-top:4px">Progress snapshot</h3></div><button class="btn sm" data-a="go" data-page="progress">Timeline</button></div>
      ${(() => { const items = timelineItems().slice(0, 5); return items.length ? `<div class="tl">${items.map(tlItem).join("")}</div>` : emptyBox("Your timeline fills in as you save scans, products, reactions and notes."); })()}</section>`)}
    ${sec("coach", `<section class="card lav"><div class="label">Skin &amp; Hair Guide</div><h3 style="margin:4px 0 12px">Ask about your skin or hair</h3>
      <div class="row" style="flex-wrap:nowrap"><label class="sr" for="dash-ask">Question for the coach</label><input type="text" id="dash-ask" placeholder="How do I build a simple evening routine?"><button class="btn primary" data-a="dashAsk">Ask</button></div>
      <div class="row" style="margin-top:10px;gap:6px">${["Explain my Hair ID", "What should I bring to a dermatologist?", "Do any of my products overlap?"].map(q => `<button class="chip toggle-chip" data-a="askPreset" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div></section>`)}
    ${sec("reminders", `<section class="card"><div class="label">Coming up</div><h3 style="margin:4px 0 10px">Reminders</h3>
      ${(() => { const n = notifications(); return n.length ? `<div class="list">${n.slice(0, 5).map(x => `<div class="li small"><div class="grow">${esc(x.text)}</div><button class="btn sm" data-a="go" data-page="${x.page}" data-tab="${x.tab}">Open</button></div>`).join("")}</div>` : `<p class="muted small">Nothing due. Add expiry dates to products or a removal date to a protective style to get reminders.</p>`; })()}</section>`)}
  </div>`;
};
function stepRow(r, st, done) {
  const k = r.id + ":" + st.id, p = S().products.find(x => x.id === st.productId);
  return `<label class="step ${done[k] ? "done" : ""}"><input type="checkbox" data-a="tick" data-k="${k}" ${done[k] ? "checked" : ""}><span class="lbl">${esc(st.label)}${p ? ` <span class="muted small">· ${esc(p.name)}</span>` : ""}${st.note ? `<br><span class="muted small">${esc(st.note)}</span>` : ""}</span></label>`;
}
Object.assign(ACTIONS, {
  tick: (el, e) => { const dk = dayKey(); const c = S().completions; c[dk] = c[dk] || {}; if (c[dk][el.dataset.k]) delete c[dk][el.dataset.k]; else c[dk][el.dataset.k] = true; commit(false); rerenderKeep(); },
  dashAsk: () => { const q = $("#dash-ask")?.value.trim(); if (!q) return; go("coach"); sendChat(q); },
  askPreset: el => { go("coach"); sendChat(el.dataset.q); },
  customiseDash: () => {
    const opts = [["clinic", "Appointments & care plan"], ["skin", "Skin ID"], ["hair", "Hair ID"], ["today", "Today's care"], ["progress", "Progress snapshot"], ["coach", "Skin & Hair Guiach"], ["reminders", "Reminders"]];
    openModal(`<h3>Customise dashboard</h3><p class="muted small" style="margin:6px 0 14px">Choose which sections appear on Home.</p>
      <div class="stack">${opts.map(([k, l]) => `<label class="row"><input type="checkbox" data-a="dashToggle" data-k="${k}" ${S().settings.dashHidden.includes(k) ? "" : "checked"} style="width:18px;height:18px;accent-color:var(--accent)"> ${l}</label>`).join("")}</div>
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn primary" data-a="closeModal">Done</button></div>`);
  },
  dashToggle: el => { const h = S().settings.dashHidden, k = el.dataset.k; const i = h.indexOf(k); i >= 0 ? h.splice(i, 1) : h.push(k); setTimeout(() => { el.checked = i >= 0; }, 0); commit(); }
});

function clinicDashCard() {

let cap = null;          // current capture session (kept in memory only)
let selRegion = null;    // selected face region
const FACE_REGIONS = { forehead: "Forehead", right_cheek: "Right cheek", left_cheek: "Left cheek", nose: "Nose", under_eyes: "Under-eye area", chin: "Chin", jawline: "Jawline" };
const SKIN_FEATURES = ["blemishes", "redness", "dark_spots", "texture", "pores", "dryness_flaking", "shine", "under_eye", "other"];
const HAIR_REGIONS = { hairline: "Front hairline", temples: "Temples", crown: "Crown", parting: "Parting", scalp: "Scalp", lengths: "Lengths", ends: "Ends", nape: "Back / nape" };
const HAIR_FEATURES = ["coverage", "scalp_visibility", "flakes", "breakage", "hairline", "texture", "redness", "buildup", "length", "other"];
const HAIR_MODES = {
  general: ["General hair photo", "Front or side view of your whole head of hair, in daylight.", "env"],
  scalp: ["Scalp observation", "Part the hair and photograph the scalp close up. Someone else holding the phone helps.", "env"],
  hairline: ["Hairline documentation", "Hair pulled back gently, face the camera, forehead and temples in frame.", "user"],
  parting: ["Parting and visible density", "A straight centre part from above, same spot each time for fair comparison.", "env"],
  breakage: ["Breakage documentation", "Ends or shed/broken pieces on a plain, contrasting background.", "env"],
  length: ["Length tracking", "Same pose and stretch each time, back or side view. Log the measured length too.", "env"],
  texture: ["Texture documentation", "A clean, product-light section of hair against a plain background.", "env"],
  reaction: ["Product reaction or scalp concern", "Photograph the affected area. Log the product in the reaction diary as well.", "env"]
};

async function handleImageFile(file) {
  if (!cap) return;
  if (!/^image\/(jpeg|png|webp|heic|heif|gif)$/i.test(file.type) && !/\.(jpe?g|png|webp|heic)$/i.test(file.name)) { cap.err = "That file type isn't supported. Use a JPEG, PNG or WebP photo."; render(); return; }
  if (file.size > 25 * 1024 * 1024) { cap.err = "That image is larger than 25 MB. Try a smaller photo."; render(); return; }
  cap.err = null; cap.stage = "loading"; render();
  try {
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch (e) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
    const w = bmp.width, h = bmp.height;
    const draw = (max, q, asBlob) => { const sc = Math.min(1, max / Math.max(w, h)); const c = document.createElement("canvas"); c.width = Math.round(w * sc); c.height = Math.round(h * sc); c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); return asBlob ? new Promise(r => c.toBlob(r, "image/jpeg", q)) : c.toDataURL("image/jpeg", q); };
    cap.blob = await draw(1600, 0.88, true);
    cap.thumb = draw(560, 0.74, false);
    cap.w = w; cap.h = h; cap.q = qualityCheck(bmp, w, h, cap.kind); cap.stage = "review";
  } catch (e) { cap.stage = "guide"; cap.err = "We couldn't open that image. Try another photo, or a JPEG instead of HEIC."; }
  render();
}

function qualityCheck(bmp, w, h, kind) {
  const sc = 256 / Math.max(w, h), cw = Math.max(8, Math.round(w * sc)), ch = Math.max(8, Math.round(h * sc));
  const c = document.createElement("canvas"); c.width = cw; c.height = ch; const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(bmp, 0, 0, cw, ch);
  const d = x.getImageData(0, 0, cw, ch).data, g = new Float32Array(cw * ch);
  let sum = 0, glare = 0;
  for (let i = 0; i < g.length; i++) { const v = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; g[i] = v; sum += v; if (v > 248) glare++; }
  const mean = sum / g.length, glareP = glare / g.length;
  let ls = 0, ls2 = 0, n = 0; // Laplacian variance = focus measure
  for (let yy = 1; yy < ch - 1; yy++) for (let xx = 1; xx < cw - 1; xx++) { const i = yy * cw + xx; const l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - cw] - g[i + cw]; ls += l; ls2 += l * l; n++; }
  const lap = ls2 / n - (ls / n) ** 2;
  const checks = [];
  const minSide = Math.min(w, h);
  checks.push({ k: "Resolution", s: minSide < 400 ? "fail" : minSide < 700 ? "warn" : "ok", m: `${w}×${h}px` + (minSide < 400 ? ", too small to judge detail" : minSide < 700 ? ", detail may be limited" : "") });
  checks.push({ k: "Lighting", s: mean < 50 ? "fail" : mean < 80 ? "warn" : mean > 228 ? "fail" : mean > 205 ? "warn" : "ok", m: mean < 50 ? "Too dark" : mean < 80 ? "On the dark side" : mean > 228 ? "Overexposed" : mean > 205 ? "Very bright" : "Even enough" });
  checks.push({ k: "Focus", s: lap < 14 ? "fail" : lap < 40 ? "warn" : "ok", m: lap < 14 ? "Blurry" : lap < 40 ? "Slightly soft" : "Sharp enough" });
  checks.push({ k: "Glare", s: glareP > 0.22 ? "fail" : glareP > 0.07 ? "warn" : "ok", m: glareP > 0.07 ? `${Math.round(glareP * 100)}% of the image is blown out` : "No strong glare" });
  const verdict = checks.some(c => c.s === "fail") ? "fail" : checks.some(c => c.s === "warn") ? "warn" : "ok";
  return { checks, verdict, metrics: { mean: Math.round(mean), focus: Math.round(lap), glare: +glareP.toFixed(3) } };
}

const SKIN_PROMPT = s => `You are the photo-description step of a personal skin-care documentation app. Look at the attached facial photograph and describe only VISIBLE, cosmetic-level features in plain language.
Rules:
- You are not diagnosing. Never name diseases, conditions or causes (no acne vulgaris, rosacea, melasma, eczema, dermatitis, infection, cancer, hormonal, etc.). Say what is visible: "a few small raised red spots on the chin", "some areas look shinier".
- Do not estimate age, ethnicity, attractiveness or identity. Judge all skin tones with equal care; if lighting, makeup, filters, camera processing or skin tone make a feature hard to judge, say so rather than guessing.
- First decide whether the photo is usable: a face clearly visible and mostly in frame, reasonably lit, in focus, no heavy beauty filter.
- "left_cheek"/"right_cheek" mean the person's own left/right.
- "confidence" means how clearly the feature can be seen in THIS photo, not medical certainty.
- Set suggest_professional to true only if something visible would reasonably warrant an in-person look (e.g. an irregular-looking or very dark mole, an open sore, a widespread rash, significant swelling), describing it neutrally.
Reply with only JSON in this shape:
{"usable":true,"quality_issues":["string"],"summary":"2-3 plain sentences","regions":[{"region":"forehead|right_cheek|left_cheek|nose|under_eyes|chin|jawline","observations":[{"feature":"${SKIN_FEATURES.join("|")}","description":"one short sentence","confidence":"low|medium|high"}]}],"not_assessable":["feature and why"],"limitations":["string"],"suggest_professional":false,"professional_reason":""}
Include only regions you can actually see. If usable is false, leave regions empty and explain in quality_issues.
What the person recorded about themselves (self-reported, may be inaccurate, do not repeat back as findings): skin type ${s.type || "not recorded"}; concerns ${s.concerns.join(", ") || "none recorded"}.`;

const HAIR_PROMPT = (h, mode) => `You are the photo-description step of a personal hair and scalp documentation app. The user chose the mode "${HAIR_MODES[mode][0]}". Describe only VISIBLE features in the attached photo, in plain language.
Rules:
- You are not diagnosing. Never name conditions or causes (no alopecia, dandruff, seborrhoeic dermatitis, fungal infection, traction alopecia, etc.) and never guess why hair looks the way it does.
- You cannot determine from a phone photo: follicle counts, growth rate, porosity, strand diameter, or causes of hair loss. Never state these; list them in not_assessable if relevant.
- Treat every hair texture, curl pattern, protective style and skin tone with equal care. Coily and tightly textured hair naturally shows more scalp at some angles and shrinks substantially; do not describe that as thinning unless clearly so, and note the uncertainty.
- First decide whether the photo is usable for this mode (relevant area visible, lit, in focus).
- "confidence" means how clearly the feature can be seen in THIS photo.
- Set suggest_professional to true only if something visible would reasonably warrant a professional look (e.g. a distinct bald patch, broken skin, marked redness or scaling, pustules), described neutrally.
Reply with only JSON in this shape:
{"usable":true,"quality_issues":["string"],"summary":"2-3 plain sentences","regions":[{"region":"${Object.keys(HAIR_REGIONS).join("|")}","observations":[{"feature":"${HAIR_FEATURES.join("|")}","description":"one short sentence","confidence":"low|medium|high"}]}],"not_assessable":["feature and why"],"limitations":["string"],"suggest_professional":false,"professional_reason":""}
Include only regions visible in the photo. If usable is false, leave regions empty.
Self-reported context (may be inaccurate, do not repeat as findings): curl pattern ${h.curl || "not recorded"}; currently in a protective style: ${S().styles.some(s => !s.removedAt) ? "yes" : "no/unknown"}; concerns ${h.concerns.join(", ") || "none recorded"}.`;

function validateResult(r, kind) {
  if (!r || typeof r !== "object" || typeof r.usable !== "boolean" || typeof r.summary !== "string") { const e = new Error("invalid_response"); e.code = "invalid_response"; throw e; }
  const regionsAllowed = kind === "skin" ? FACE_REGIONS : HAIR_REGIONS, feats = kind === "skin" ? SKIN_FEATURES : HAIR_FEATURES;
  const arr = v => Array.isArray(v) ? v.filter(x => typeof x === "string" && x.trim()).map(x => x.slice(0, 400)) : [];
  const regions = (Array.isArray(r.regions) ? r.regions : []).filter(g => g && regionsAllowed[g.region]).map(g => ({
    region: g.region,
    observations: (Array.isArray(g.observations) ? g.observations : []).filter(o => o && typeof o.description === "string" && o.description.trim())
      .map(o => ({ feature: feats.includes(o.feature) ? o.feature : "other", description: o.description.slice(0, 400), confidence: ["low", "medium", "high"].includes(o.confidence) ? o.confidence : "unstated" }))
  })).filter(g => g.observations.length);
  return { usable: r.usable, quality_issues: arr(r.quality_issues), summary: r.summary.slice(0, 800), regions: r.usable ? regions : [], not_assessable: arr(r.not_assessable), limitations: arr(r.limitations), suggest_professional: !!r.suggest_professional, professional_reason: typeof r.professional_reason === "string" ? r.professional_reason.slice(0, 400) : "" };
}

async function persistCapturePhoto(a) {
  const pid = uid(); a.photoIds = [pid]; Store.photoCache[pid] = cap.thumb;
  a.photoStored = false;
  if (S().consent.photos) { try { await Store.putPhoto(pid, cap.thumb, a.at); a.photoStored = true; } catch (e) { toast(e.message || "Photo couldn't be stored."); } }
}

Object.assign(ACTIONS, {
  capStart: el => { cap = { kind: el.dataset.kind, mode: el.dataset.mode || (el.dataset.kind === "skin" ? "face" : null), stage: "guide" }; render(); },
