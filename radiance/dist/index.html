  capDocument: async () => { // save photo without AI analysis
    const a = { id: uid(), kind: cap.kind, mode: cap.mode, at: nowISO(), status: "documented", saved: false, provider: "None (photo only)", input: { width: cap.w, height: cap.h }, quality: cap.q, notes: "", result: null };
    await persistCapturePhoto(a); S().assessments.unshift(a); Store.save(); cap = null; R.tab = "history"; R.id = a.id; render();
  },
  capAnalyse: async () => {
    if (!Clinic.c.ai[cap.kind]) { cap.err = AI_ERR.disabled; render(); return; }
    if (!S().consent.ai) {
      return confirmBox("Allow AI photo analysis?", "Your photo will be sent to Claude (Anthropic) through claude.ai to describe visible features. Results are cosmetic observations, not diagnoses. You can turn this off in Settings.", "Allow and analyse", () => {
        const c = S().consent; c.ai = true; c.history.unshift({ at: nowISO(), photos: c.photos, ai: true, coachContext: c.coachContext }); Store.save(); ACTIONS.capAnalyse(); }, false);
    }
    if (Cap.sample === undefined) { toast("Still connecting to the AI service. Try again in a moment."); return; }
    if (!Cap.sample || !Cap.imgOK) { cap.err = AI_ERR[!Cap.sample ? "unavailable" : "images_unavailable"]; render(); return; }
    const a = { id: uid(), kind: cap.kind, mode: cap.mode, at: nowISO(), status: "processing", saved: false, provider: "Claude (Anthropic) via claude.ai", model: "", input: { width: cap.w, height: cap.h }, quality: cap.q, notes: "", result: null };
    cap.stage = "processing"; cap.ctl = new AbortController(); cap.aid = a.id; render();
    try {
      const prompt = a.kind === "skin" ? SKIN_PROMPT(S().skin) : HAIR_PROMPT(S().hair, a.mode);
      const raw = await Cap.sample.json(prompt, { images: [cap.blob], modelTier: "default", signal: cap.ctl.signal });
      a.result = validateResult(raw, a.kind); a.status = a.result.usable ? "completed" : "rejected"; a.model = "Model tier: default";
    } catch (e) {
      if (e?.code === "cancelled") { cap.stage = "review"; render(); return; }
      a.status = "failed"; a.error = e?.code || e?.message || "error";
      if (a.status === "failed") { cap.stage = "review"; cap.err = aiErr(e); render(); return; } // nothing recorded on failure
    }
    if (a.status === "rejected") { cap.stage = "review"; cap.rejected = a.result; render(); return; }
    await persistCapturePhoto(a); S().assessments.unshift(a); Store.save(); cap = null; R.tab = "history"; R.id = a.id; render();
  },
  saveAssessment: el => { const a = S().assessments.find(x => x.id === el.dataset.id); a.saved = true; commit(); toast("Saved to your history"); },
  discardAssessment: el => { const a = S().assessments.find(x => x.id === el.dataset.id); (a.photoIds || []).forEach(p => Store.deletePhoto(p)); S().assessments = S().assessments.filter(x => x !== a); R.id = null; R.tab = "scan"; commit(); },
  deleteAssessment: el => confirmBox("Delete this assessment?", "The photo and its observations will be permanently removed.", "Delete", () => {
    const a = S().assessments.find(x => x.id === el.dataset.id); (a.photoIds || []).forEach(p => Store.deletePhoto(p)); S().assessments = S().assessments.filter(x => x !== a); R.id = null; commit(); toast("Deleted"); }),
  selRegion: el => { selRegion = selRegion === el.dataset.r ? null : el.dataset.r; rerenderKeep(); },
  toggleReport: el => { const a = S().assessments.find(x => x.id === el.dataset.id); a.includeInReport = !a.includeInReport; commit(false); rerenderKeep(); },
  addRegionNote: () => { const t = $("#region-note")?.value.trim(); if (!t || !selRegion) return; const rn = S().skin.regionNotes; (rn[selRegion] = rn[selRegion] || []).unshift({ id: uid(), at: nowISO(), text: t, source: "self" }); commit(false); rerenderKeep(); },
  delRegionNote: el => { const rn = S().skin.regionNotes; rn[el.dataset.r] = rn[el.dataset.r].filter(n => n.id !== el.dataset.id); commit(false); rerenderKeep(); },
  reportAI: el => openModal(`<h3>Report a problem with this analysis</h3><p class="muted small" style="margin:6px 0 14px">Feedback is stored with your records. Your photo is never used for training.</p>
    <div class="stack"><label class="field" for="fb-kind"><span>What went wrong?</span><select id="fb-kind"><option>Incorrect observation</option><option>Missed something visible</option><option>Confusing wording</option><option>Didn't account for my skin tone or hair texture</option><option>Image-analysis problem</option><option>Other</option></select></label>
    <label class="field" for="fb-note"><span>Details (optional)</span><textarea id="fb-note"></textarea></label></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="submitAIFeedback" data-id="${el.dataset.id}">Send</button></div>`),
  submitAIFeedback: el => { S().aiFeedback.unshift({ id: uid(), at: nowISO(), target: el.dataset.id, kind: $("#fb-kind").value, note: $("#fb-note").value }); closeModal(); commit(false); toast("Thanks. Feedback recorded."); },
  askAboutAssessment: el => { const a = S().assessments.find(x => x.id === el.dataset.id); go("coach"); sendChat(`Can you explain my ${a.kind === "skin" ? "skin" : "hair"} photo assessment from ${fmtDate(a.at)} in plain terms, and what I could document next time?`); }
});

    <div class="notice" style="margin-top:16px">${ic("info")}<div>Some characteristics can't be judged from a photo: porosity, strand diameter, growth rate and the cause of any hair change. Use the <button class="btn sm" data-a="tab" data-tab="porosity">porosity questionnaire</button> and the length log for those.</div></div>`;
  }

function reviewPanel(c) {

function faceMap(highlights = {}) {
  const rg = (k, shape) => `<g role="button" tabindex="0" aria-label="${FACE_REGIONS[k]}${highlights[k] ? `, ${highlights[k]} entries` : ""}" data-a="selRegion" data-r="${k}">${shape.replace(/class="rg"/g, `class="rg ${highlights[k] ? "has" : ""} ${selRegion === k ? "sel" : ""}"`)}<title>${FACE_REGIONS[k]}</title></g>`;
  return `<svg class="facemap" viewBox="0 0 200 260" role="group" aria-label="Face regions (your left is on the right of the drawing)">
    <ellipse class="outline" cx="100" cy="132" rx="80" ry="108"/>
    ${rg("forehead", '<path class="rg" d="M40 82 Q100 18 160 82 L154 98 Q100 84 46 98 Z"/>')}
    ${rg("under_eyes", '<ellipse class="rg" cx="70" cy="126" rx="18" ry="7"/><ellipse class="rg" cx="130" cy="126" rx="18" ry="7"/>')}
    ${rg("nose", '<path class="rg" d="M92 108 L108 108 L116 164 Q100 172 84 164 Z"/>')}
    ${rg("right_cheek", '<ellipse class="rg" cx="57" cy="160" rx="24" ry="22"/>')}
    ${rg("left_cheek", '<ellipse class="rg" cx="143" cy="160" rx="24" ry="22"/>')}
    ${rg("jawline", '<path class="rg" d="M30 172 Q42 226 100 240 Q158 226 170 172 L160 176 Q148 218 100 229 Q52 218 40 176 Z"/>')}
    ${rg("chin", '<ellipse class="rg" cx="100" cy="212" rx="24" ry="12"/>')}
    <path d="M58 112 Q70 106 82 112 M118 112 Q130 106 142 112" stroke="var(--muted)" stroke-width="1.4" fill="none"/>
    <path d="M86 190 Q100 197 114 190" stroke="var(--muted)" stroke-width="1.4" fill="none"/>
    <text x="22" y="252" style="font-size:9px">your right</text><text x="148" y="252" style="font-size:9px">your left</text>
  </svg>`;
}

function obsList(obs) {
  return obs.map(o => `<div class="li"><div class="grow"><div class="row" style="gap:6px"><span class="chip ai">${pretty(o.feature)}</span><span class="chip">Visibility: ${o.confidence}</span>${o.date ? `<span class="muted small">${fmtDate(o.date)}</span>` : ""}</div><p class="small" style="margin-top:6px">${esc(o.description)}</p></div></div>`).join("");
}

function assessmentView(a) {
  const isSkin = a.kind === "skin", r = a.result, idx = S().assessments.indexOf(a);
  const regionsMap = isSkin ? FACE_REGIONS : HAIR_REGIONS;
  const hi = {}; (r?.regions || []).forEach(g => hi[g.region] = g.observations.length);
  const shown = r ? (isSkin && selRegion ? r.regions.filter(g => g.region === selRegion) : r.regions) : [];
  return `
  <div class="spread" style="margin-bottom:16px"><button class="btn sm ghost" data-a="tab" data-tab="history">← All assessments</button>
    <div class="row">${a.saved ? `<span class="chip ok">Saved</span>` : `<span class="chip warn">Not saved yet</span>`}<span class="chip">${a.status === "documented" ? "Photo only" : "AI-assisted"}</span></div></div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px" id="assess-grid">
    <div class="stack">
      <div class="viewport">${(a.photoIds || [])[0] ? `<img data-photo="${a.photoIds[0]}" alt="Photo from ${fmtDate(a.at)}">` : ""}</div>
      ${a.photoStored === false ? `<p class="muted small">Photo storage is off, so this photo is only available until you close the app.</p>` : ""}
      ${isSkin && r ? `<div class="card"><div class="label" style="margin-bottom:8px">Areas assessed · tap to filter</div>${faceMap(hi)}</div>` : ""}
      <div class="card"><div class="label" style="margin-bottom:8px">Provenance</div><dl class="kv small">
        <dt>Captured</dt><dd>${fmtDate(a.at)} ${fmtTime(a.at)}</dd><dt>Type</dt><dd>${isSkin ? "Face" : esc(HAIR_MODES[a.mode]?.[0] || a.mode)}</dd>
        <dt>Analysis</dt><dd>${esc(a.provider)}</dd>${a.model ? `<dt>Model</dt><dd>${esc(a.model)}</dd>` : ""}
        <dt>Input</dt><dd>${a.input?.width}×${a.input?.height}px, sent downscaled</dd>
        <dt>On-device check</dt><dd>${(a.quality?.checks || []).map(c => `${c.k}: ${c.s}`).join(" · ")}</dd>
        <dt>Consent</dt><dd>${a.status === "documented" ? "Photo only, not sent" : "AI analysis consented"}</dd></dl></div>
    </div>
    <div class="stack">
      ${r ? `<div class="card raised"><div class="label">Summary</div><p style="margin-top:8px;font-size:1.02rem">${esc(r.summary)}</p>
        <p class="muted small" style="margin-top:10px">These are descriptions of what's visible in one photo, not a diagnosis. Lighting and camera processing affect what can be seen.</p></div>
        ${r.suggest_professional ? `<div class="notice warn">${ic("warn")}<div><b>Worth showing a professional.</b> ${esc(r.professional_reason)} A photo can't tell what this is. A dermatologist or doctor can examine it properly. <button class="btn sm" data-a="go" data-page="pro" data-tab="prep" style="margin-top:8px">Prepare a report</button></div></div>` : ""}
        <div class="card"><div class="spread"><div class="label">Observations ${isSkin && selRegion ? "· " + FACE_REGIONS[selRegion] : ""}</div>${isSkin && selRegion ? `<button class="btn sm ghost" data-a="selRegion" data-r="${selRegion}">Show all</button>` : ""}</div>
          ${shown.length ? shown.map(g => `<div style="margin-top:12px"><b class="small">${regionsMap[g.region]}</b><div class="list">${obsList(g.observations)}</div></div>`).join("") : `<p class="muted small" style="margin-top:10px">No visible observations recorded${isSkin && selRegion ? " for this area" : ""}.</p>`}</div>
        ${r.not_assessable.length || r.limitations.length || r.quality_issues.length ? `<div class="card"><div class="label">Limits of this photo</div><ul class="small" style="margin:8px 0 0;padding-left:18px;display:grid;gap:4px">${[...r.quality_issues, ...r.limitations, ...r.not_assessable.map(x => "Not assessable: " + x)].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}`
      : `<div class="card"><div class="label">Photo record</div><p style="margin-top:8px">This photo was saved for documentation without AI analysis. Add your own notes below, or compare it with other dates.</p></div>`}
      ${!isSkin ? `<div class="card tint"><div class="label">Your Hair ID (self-reported)</div><dl class="kv small" style="margin-top:8px"><dt>Pattern</dt><dd>${val(S().hair.curl)}</dd><dt>Porosity</dt><dd>${val(S().hair.porosity)}</dd><dt>Density</dt><dd>${val(S().hair.density)}</dd><dt>Scalp</dt><dd>${val(S().hair.scalp.type)}</dd></dl></div>` : ""}
      <div class="card"><label class="field" for="a-notes"><span>Your notes</span><textarea id="a-notes" data-bind="assessments.${idx}.notes" placeholder="Products used this week, how your skin or scalp felt, anything the photo doesn't show">${esc(a.notes)}</textarea></label>
        <label class="row small" style="margin-top:10px"><input type="checkbox" data-a="toggleReport" data-id="${a.id}" ${a.includeInReport ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--accent)"> Include in my next consultation report</label></div>
      <div class="row">
        ${a.saved ? "" : `<button class="btn primary" data-a="saveAssessment" data-id="${a.id}">${ic("save")} Save to history</button><button class="btn" data-a="discardAssessment" data-id="${a.id}">Discard</button>`}
        ${a.saved ? `<button class="btn" data-a="go" data-page="${a.kind}" data-tab="compare" data-id="${a.id}">Compare</button>` : ""}
        ${r ? `<button class="btn" data-a="askAboutAssessment" data-id="${a.id}">Ask the coach</button><button class="btn ghost" data-a="reportAI" data-id="${a.id}">Report a problem</button>` : ""}
        ${a.saved ? `<button class="btn danger" data-a="deleteAssessment" data-id="${a.id}">${ic("trash")} Delete</button>` : ""}
      </div>
    </div>
  </div>`;
}

function historyView(kind) {
  if (R.id) { const a = S().assessments.find(x => x.id === R.id); if (a) return assessmentView(a); }
  const list = S().assessments.filter(a => a.kind === kind && a.saved).sort((a, b) => b.at.localeCompare(a.at));
  if (!list.length) return emptyBox(`No saved ${kind === "skin" ? "face" : "hair or scalp"} assessments yet.`, `<button class="btn primary" data-a="tab" data-tab="scan">${ic("camera")} Take a photo</button>`);
  return `<div class="card"><div class="list">${list.map(a => `<div class="li"><img class="thumb" data-photo="${a.photoIds?.[0] || ""}" alt=""><div class="grow"><div class="row" style="gap:6px"><b>${fmtDate(a.at)}</b><span class="muted small">${fmtTime(a.at)}</span>${a.status === "documented" ? `<span class="chip">Photo only</span>` : `<span class="chip ai">AI-assisted</span>`}${kind === "hair" ? `<span class="chip">${esc(HAIR_MODES[a.mode]?.[0] || "")}</span>` : ""}</div>
    <p class="small muted" style="margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.result?.summary || a.notes || "No notes")}</p></div><button class="btn sm" data-a="go" data-page="${kind}" data-tab="history" data-id="${a.id}">Open</button></div>`).join("")}</div></div>`;
}

let cmpSel = { skin: [null, null], hair: [null, null] };
function compareView(kind) {
  const list = S().assessments.filter(a => a.kind === kind && a.saved && a.photoIds?.length).sort((a, b) => a.at.localeCompare(b.at));
  if (list.length < 2) return emptyBox("You need at least two saved photos to compare. Take photos in similar light and position a few weeks apart.", `<button class="btn primary" data-a="tab" data-tab="scan">Take a photo</button>`);
  const cs = cmpSel[kind];
  if (R.id && !cs.includes(R.id)) { cs[1] = R.id; }
  if (!cs[0] || !list.find(a => a.id === cs[0])) cs[0] = list[0].id;
  if (!cs[1] || !list.find(a => a.id === cs[1]) || cs[1] === cs[0]) cs[1] = list.at(-1).id === cs[0] ? list[0].id : list.at(-1).id;
  const A = list.find(a => a.id === cs[0]), B = list.find(a => a.id === cs[1]);
  const opt = (sel) => list.map(a => `<option value="${a.id}" ${a.id === sel ? "selected" : ""}>${fmtDate(a.at)}${kind === "hair" ? " · " + (HAIR_MODES[a.mode]?.[0] || "") : ""}</option>`).join("");
  const side = (a, l) => `<div class="card"><div class="label">${l} · ${fmtDate(a.at)}</div><p class="small" style="margin-top:6px">${esc(a.result?.summary || "Photo only, no AI description.")}</p>${a.notes ? `<p class="small muted" style="margin-top:6px">Your note: ${esc(a.notes)}</p>` : ""}</div>`;
  return `<div class="notice" style="margin-bottom:16px">${ic("info")}<div class="small">Differences between photos can come from light, angle, distance and camera processing. A comparison shows change over time; it can't show what caused it.${kind === "hair" && A.mode !== B.mode ? " <b>These photos use different modes, so the views may not match.</b>" : ""}</div></div>
  <div class="grid g2" style="margin-bottom:16px"><label class="field" for="cmp-a"><span>Before</span><select id="cmp-a" data-a2="cmp" data-i="0" data-kind="${kind}">${opt(cs[0])}</select></label><label class="field" for="cmp-b"><span>After</span><select id="cmp-b" data-a2="cmp" data-i="1" data-kind="${kind}">${opt(cs[1])}</select></label></div>
  <div class="grid" style="grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:20px" id="cmp-grid">
    <div class="cmp" id="cmp-box"><img data-photo="${A.photoIds[0]}" alt="Before, ${fmtDate(A.at)}"><img class="after" id="cmp-after" data-photo="${B.photoIds[0]}" alt="After, ${fmtDate(B.at)}"><div class="handle" id="cmp-handle"></div>
      <span class="tag" style="left:10px">${fmtDate(A.at, { day: "numeric", month: "short" })}</span><span class="tag" style="right:10px">${fmtDate(B.at, { day: "numeric", month: "short" })}</span>
      <label class="sr" for="cmp-range">Comparison slider</label><input type="range" id="cmp-range" min="0" max="100" value="50" data-cmp="1"></div>
    <div class="stack">${side(A, "Before")}${side(B, "After")}<p class="muted small">${daysBetween(A.at, B.at)} days apart. Both photos are shown at the same size and crop.</p>
      <div class="row"><button class="btn" data-a="exportCompare" data-kind="${kind}">Export comparison</button></div></div>
  </div>`;
}
document.addEventListener("input", e => { if (e.target.dataset.cmp) { const v = e.target.value; $("#cmp-after").style.clipPath = `inset(0 0 0 ${v}%)`; $("#cmp-handle").style.left = v + "%"; } });
document.addEventListener("change", e => { if (e.target.dataset.a2 === "cmp") { cmpSel[e.target.dataset.kind][+e.target.dataset.i] = e.target.value; R.id = null; rerenderKeep(); } });
ACTIONS.exportCompare = async el => {
  const kind = el.dataset.kind, [ia, ib] = cmpSel[kind]; const A = S().assessments.find(a => a.id === ia), B = S().assessments.find(a => a.id === ib);
  const [pa, pb] = await Promise.all([Store.getPhoto(A.photoIds[0]), Store.getPhoto(B.photoIds[0])]);
  const block = (a, p, l) => `<section><h2>${l}: ${fmtDate(a.at)}</h2>${p ? `<img src="${p}" style="max-width:100%;width:360px;border-radius:12px">` : "<p>(photo not stored)</p>"}<p>${esc(a.result?.summary || "Photo only.")}</p>${a.notes ? `<p><i>Note: ${esc(a.notes)}</i></p>` : ""}</section>`;
  saveFile(`radiance-comparison-${dayKey()}.html`, docWrap(`${kind === "skin" ? "Skin" : "Hair"} photo comparison`, block(A, pa, "Before") + block(B, pb, "After") + `<p class="note">Photo differences can reflect lighting and positioning. AI descriptions are visible observations, not diagnoses.</p>`));
};

/* ---------- 9. Skin Lab ---------- */
PAGES.skin = () => {
  const t = R.tab || "id";
  return pageHead("Skin Lab", "Your skin, documented", "Your Skin ID, guided face photos, and a dated history you can compare.") +
    tabs([["id", "Skin ID"], ["scan", "New scan"], ["history", "History"], ["compare", "Compare"]], t) +
    (t === "id" ? skinIdView() : t === "scan" ? captureView("skin") : t === "history" ? historyView("skin") : compareView("skin"));
};
function regionData(k) {
  const notes = (S().skin.regionNotes[k] || []).map(n => ({ ...n, kind: "note" }));
  const obs = []; S().assessments.filter(a => a.kind === "skin" && a.saved && a.result).forEach(a => a.result.regions.filter(g => g.region === k).forEach(g => g.observations.forEach(o => obs.push({ ...o, date: a.at, aid: a.id }))));
  return { notes, obs };
}
function skinIdView() {
  const s = S().skin, hi = {};
  Object.keys(FACE_REGIONS).forEach(k => { const d = regionData(k); const n = d.notes.length + d.obs.length; if (n) hi[k] = n; });
  const rd = selRegion ? regionData(selRegion) : null;
  return `<div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px" id="skinid-grid">
  <div class="stack">
    <div class="idcard"><div class="spread"><span class="label">Skin ID</span><span class="code">SKN · ${esc((Store.uid || "local").slice(0, 6).toUpperCase())}</span></div>
      <dl class="kv" style="margin-top:14px">
        <dt>Skin type</dt><dd>${val(s.type)} ${s.type ? srcChip(s.src.type) : ""}</dd>
        <dt>Sensitivity</dt><dd>${val(s.sensitivity)} ${s.sensitivity ? srcChip(s.src.sensitivity) : ""}</dd>
        <dt>Dry / oily tendency</dt><dd>${val(s.tendency)}</dd>
        <dt>Feels tight (dehydration)</dt><dd>${val(s.dehydration)}</dd>
        <dt>Allergies & sensitivities</dt><dd>${val(s.allergies)}</dd>
        <dt>Concerns</dt><dd>${s.concerns.length ? s.concerns.map(c => `<span class="chip self">${esc(c)}</span>`).join("") : val("")}</dd>
        <dt>Goals</dt><dd>${val(s.goals)}</dd></dl>
      <p class="muted small" style="margin-top:12px">Skin type, sensitivity, dehydration and allergies are recorded separately on purpose: they're different things.</p></div>
    <details class="card" open><summary style="cursor:pointer;font-weight:600">Edit Skin ID</summary>
      <div class="stack" style="margin-top:14px;gap:16px">
        <div class="grid g2">${sel("skin.type", OPT.skinType, "Skin type")}${sel("skin.sensitivity", OPT.sensitivity, "Sensitivity")}${sel("skin.tendency", OPT.tendency, "Dryness or oiliness tendency")}${sel("skin.dehydration", OPT.dehydration, "Does it feel tight or dehydrated?")}</div>
        <div class="field"><span>Visible concerns you want to track</span>${chipsPick("skin.concerns", OPT.skinConcerns)}</div>
        ${txt("skin.allergies", "Known allergies or product sensitivities", "Comma separated. The product checker flags these.")}
        ${txt("skin.goals", "Personal skin goals")}${txt("skin.preferred", "Products or ingredients you like")}
        ${txt("skin.notes", "Notes", "", "", true)}
      </div></details>
    <details class="card"><summary style="cursor:pointer;font-weight:600">Change history (${s.history.length})</summary>
      ${s.history.length ? `<div class="list" style="margin-top:10px">${s.history.slice(0, 25).map(h => `<div class="li small"><span class="mono muted">${fmtDate(h.at)}</span><div class="grow"><b>${pretty(h.field)}</b>: ${esc(h.from || "—")} → ${esc(h.to || "—")}</div></div>`).join("")}</div>` : `<p class="muted small" style="margin-top:8px">Edits to your Skin ID are logged here.</p>`}</details>
  </div>
  <div class="stack">
    <div class="card"><div class="label" style="margin-bottom:6px">Face map</div><p class="muted small" style="margin-bottom:10px">Tap an area to see notes and photo observations for it.</p>${faceMap(hi)}</div>
    ${rd ? `<div class="card raised"><div class="spread"><h3>${FACE_REGIONS[selRegion]}</h3><button class="btn sm ghost" data-a="selRegion" data-r="${selRegion}">Close</button></div>
      <div class="row" style="margin-top:12px;flex-wrap:nowrap"><label class="sr" for="region-note">Add a note</label><input type="text" id="region-note" placeholder="Add a note about this area"><button class="btn sm primary" data-a="addRegionNote">Add</button></div>
      <div class="list" style="margin-top:8px">${rd.notes.map(n => `<div class="li"><div class="grow"><div class="row" style="gap:6px">${srcChip(n.source)}<span class="muted small">${fmtDate(n.at)}</span></div><p class="small" style="margin-top:4px">${esc(n.text)}</p></div><button class="icon-btn" aria-label="Delete note" data-a="delRegionNote" data-r="${selRegion}" data-id="${n.id}">${ic("trash")}</button></div>`).join("")}
      ${obsList(rd.obs)}</div>
      ${!rd.notes.length && !rd.obs.length ? `<p class="muted small" style="margin-top:8px">Nothing recorded for this area yet.</p>` : ""}</div>`
      : `<div class="notice">${ic("info")}<div class="small">Areas tinted lavender have notes or photo observations.</div></div>`}
  </div></div>`;
}

/* ---------- 10. Hair Lab ---------- */
PAGES.hair = () => {
  const t = R.tab || "id";
  return pageHead("Hair Lab", "Hair and scalp, over time", "Your Hair ID, guided photos for hairline, parting and scalp, a porosity questionnaire and a length log.") +
    tabs([["id", "Hair ID"], ["scan", "Document"], ["porosity", "Porosity check"], ["length", "Length log"], ["history", "History"], ["compare", "Compare"]], t) +
    (t === "id" ? hairIdView() : t === "scan" ? captureView("hair") : t === "porosity" ? porosityView() : t === "length" ? lengthView() : t === "history" ? historyView("hair") : compareView("hair"));
};
const lvlScale = (v, opts) => { const i = opts.indexOf(v); return i >= 0 && i < 3 ? `<div class="scale" aria-hidden="true">${[0, 1, 2].map(n => `<i class="${n <= i ? "on" : ""}"></i>`).join("")}</div>` : ""; };
function hairIdView() {
  const h = S().hair;
  const cell = (l, v, opts, src, note) => `<div class="card" style="padding:16px"><div class="label">${l}</div><div class="row" style="margin-top:6px;gap:6px"><b style="font-size:1.05rem">${val(v)}</b>${v ? srcChip(src) : ""}</div>${opts ? lvlScale(v, opts) : ""}${note ? `<p class="muted small" style="margin-top:8px">${note}</p>` : ""}</div>`;
  return `<div class="grid g3" style="margin-bottom:16px">
    ${cell("Curl pattern", h.curl, null, h.src.curl, h.curlDetail ? esc(h.curlDetail) : "Descriptive only, not a medical category.")}
    ${cell("Porosity", h.porosity, ["Low", "Medium", "High"], h.src.porosity, "Can't be read from a photo. Use the questionnaire.")}
    ${cell("Density", h.density, ["Low", "Medium", "High"], h.src.density, "How much hair you have overall.")}
    ${cell("Strand thickness", h.thickness, ["Fine", "Medium", "Coarse"], h.src.thickness, "Width of one strand, not the amount of hair.")}
    ${cell("Elasticity", h.elasticity, null, h.src.elasticity, "Home stretch tests vary with moisture and treatments.")}
    ${cell("Scalp", h.scalp.type, null, h.src["scalp.type"], h.scalp.flaking && h.scalp.flaking !== "None" ? "Flaking: " + esc(h.scalp.flaking) : "")}
  </div>
  <div class="grid g2">
    <details class="card" open><summary style="cursor:pointer;font-weight:600">Hair structure</summary><div class="stack" style="margin-top:14px">
      <div class="grid g2">${sel("hair.curl", OPT.curl, "Curl pattern")}${txt("hair.curlDetail", "Curl detail (optional)", "e.g. 4C crown, 4A nape")}${sel("hair.porosity", OPT.porosity, "Porosity")}${sel("hair.density", OPT.density, "Density")}${sel("hair.thickness", OPT.thickness, "Strand thickness")}${sel("hair.elasticity", OPT.elasticity, "Elasticity observation")}</div>
      <div class="grid g2">${txt("hair.length", "Current length", "", "e.g. shoulder length stretched")}${txt("hair.desiredLength", "Desired length")}</div>${txt("hair.shrinkage", "Shrinkage observations")}
    </div></details>
    <details class="card" open><summary style="cursor:pointer;font-weight:600">Scalp profile</summary><div class="stack" style="margin-top:14px">
      <div class="grid g2">${sel("hair.scalp.type", OPT.scalp, "Scalp type")}${sel("hair.scalp.oiliness", OPT.level, "Oiliness")}${sel("hair.scalp.dryness", OPT.level, "Dryness")}${sel("hair.scalp.flaking", OPT.level, "Flaking")}${sel("hair.scalp.itch", OPT.level, "Itchiness")}${sel("hair.scalp.sensitivity", OPT.level, "Sensitivity or discomfort")}${sel("hair.scalp.buildup", OPT.level, "Product buildup")}</div>
      ${txt("hair.scalp.notes", "Scalp notes", "Self-observed redness, tenderness, when it changes")}
      <p class="muted small">Recording flaking or itch doesn't diagnose anything. If symptoms are persistent, painful or spreading, see a dermatologist.</p>
    </div></details>
    <details class="card"><summary style="cursor:pointer;font-weight:600">History and habits</summary><div class="stack" style="margin-top:14px">
      <div class="grid g2">${sel("hair.chemical", OPT.chemical, "Chemical treatments")}${txt("hair.colour", "Colouring")}${sel("hair.heat", OPT.heat, "Heat styling")}${sel("hair.washFreq", OPT.washFreq, "Wash frequency")}${txt("hair.protective", "Protective styles you wear")}${txt("hair.detangling", "Detangling method")}</div>
      <div class="field"><span>Concerns</span>${chipsPick("hair.concerns", OPT.hairConcerns)}</div>${txt("hair.goals", "Hair goals")}${txt("hair.notes", "Notes", "", "", true)}
    </div></details>
    <details class="card"><summary style="cursor:pointer;font-weight:600">Change history (${h.history.length})</summary>

const POROSITY_Q = [

  ["How long does it take to air-dry?", [["Fast, often under an hour or two", "H"], ["A few hours", "M"], ["Very long, sometimes most of a day", "L"]]],
  ["What happens with leave-ins and creams?", [["They seem to disappear; I need more soon", "H"], ["They absorb reasonably", "M"], ["They sit on top or build up", "L"]]],
  ["Chemical or heat history?", [["Frequent bleach, relaxer or high heat", "H"], ["Occasional", "M"], ["Rarely or never", "L"]]],
  ["Does your hair feel dry again soon after moisturising?", [["Often, within a day", "H"], ["Sometimes", "M"], ["Rarely; moisture lasts", "L"]]]

let poroAns = {};
function porosityView() {
  const n = Object.keys(poroAns).length, tally = { H: 0, M: 0, L: 0 }; Object.values(poroAns).forEach(v => tally[v]++);
  const top = n === POROSITY_Q.length ? Object.entries(tally).sort((a, b) => b[1] - a[1]) : null;

  return `<div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px" id="poro-grid"><div class="stack">
    ${POROSITY_Q.map(([q, as], i) => `<div class="card"><b>${i + 1}. ${q}</b><div class="choice-grid" style="margin-top:10px">${as.map(([l, v]) => `<button class="choice" aria-pressed="${poroAns[i] === v}" data-a="poro" data-i="${i}" data-v="${v}">${l}</button>`).join("")}</div></div>`).join("")}</div>
  <div class="stack"><div class="card raised" style="position:sticky;top:20px"><div class="label">Result</div>
    ${res ? `<h2 style="margin:8px 0">${res === "Mixed / unclear" ? "Mixed signals" : res + " porosity tendency"}</h2><p class="muted small">Answers: ${tally.H} high, ${tally.M} medium, ${tally.L} low. This is a self-assessment, not a measurement. Porosity can differ between your roots and ends.</p>
      ${res !== "Mixed / unclear" ? `<button class="btn primary" data-a="poroSave" data-v="${res}" style="margin-top:14px">Save to Hair ID as questionnaire result</button>` : `<p class="small" style="margin-top:10px">Try keeping notes on how products behave over a few wash days, then retake it.</p>`}`
      : `<p class="muted" style="margin-top:8px">${n}/${POROSITY_Q.length} answered.</p><div class="bar" style="margin-top:10px"><i style="width:${n / POROSITY_Q.length * 100}%"></i></div>`}
    <p class="muted small" style="margin-top:14px">Why not the float test? A strand floating or sinking in a glass is affected by oils, product residue and surface tension, so on its own it isn't a reliable measure.</p></div></div></div>`;
}

      : `<div class="card"><p>No overlaps or documented interaction concerns found among the listed ingredients.</p><p class="muted small" style="margin-top:6px">That covers only the ingredients entered and the reference list in this app. It isn't a guarantee these products suit you.</p></div>`)
    : `<div class="empty">Pick two or more products to check shared ingredients, overlapping actives and anything matching your recorded sensitivities.</div>`}

function checkCompat(list) {
  const out = [], groups = {};
  const allergies = S().skin.allergies.toLowerCase().split(",").map(x => x.trim()).filter(Boolean);
  list.forEach(p => {
    if (!p.ingredients.length) out.push({ level: "gap", title: p.name, text: "No ingredient list recorded, so this product couldn't be checked." });
    p.ingredients.forEach(i => { const ing = findIng(i); if (ing) (groups[ing.group] = groups[ing.group] || new Set()).add(p.name);
      allergies.forEach(a => { if (i.toLowerCase().includes(a) || (findIng(a) && ing && findIng(a).key === ing.key)) out.push({ level: "personal", title: `${p.name} contains ${i}`, text: `You recorded "${a}" as an allergy or sensitivity.` }); }); });
  });
  const has = g => groups[g] && groups[g].size;
  const names = g => [...groups[g]].join(", ");
  if (has("bpo") && has("retinoid")) out.push({ level: "concern", title: "Benzoyl peroxide with a retinoid", text: `Applied together, benzoyl peroxide can break down some retinoids such as tretinoin, and both can be drying. Products: ${names("bpo")}; ${names("retinoid")}. Product guidance often suggests using them at different times of day.` });
  if (groups.retinoid?.size > 1) out.push({ level: "precaution", title: "More than one retinoid", text: `Retinoids appear in ${names("retinoid")}. Layering several usually adds irritation without clear extra benefit.` });
  if (has("retinoid") && has("exfoliant")) out.push({ level: "precaution", title: "Retinoid with exfoliating acids", text: `Using ${names("retinoid")} alongside ${names("exfoliant")} in the same routine commonly increases dryness and irritation. Many people alternate nights.` });
  if (groups.exfoliant?.size > 1) out.push({ level: "precaution", title: "Several exfoliating acids", text: `Exfoliating acids appear in ${names("exfoliant")}. Stacking them can over-exfoliate.` });
  if (has("vitc") && has("exfoliant")) out.push({ level: "precaution", title: "Vitamin C with exfoliating acids", text: "Both are acidic. Some people find this combination stings; others tolerate it." });
  if ((has("exfoliant") || has("retinoid")) && !list.some(p => p.category === "Sunscreen")) out.push({ level: "info", title: "Sun protection", text: "Exfoliants and retinoids can make skin more sun-sensitive. None of the selected products is a sunscreen." });
  const counts = {}; list.forEach(p => new Set(p.ingredients.map(i => i.toLowerCase())).forEach(i => counts[i] = (counts[i] || 0) + 1));
  const shared = Object.entries(counts).filter(([i, n]) => n > 1 && !["water", "aqua", "glycerin"].includes(i)).map(([i]) => i);
  if (shared.length) out.push({ level: "info", title: "Shared ingredients", text: `Found in more than one product: ${shared.slice(0, 12).join(", ")}${shared.length > 12 ? "…" : ""}. Usually harmless; useful to know if you react to one.` });
  return out;
}

function lineChart(pts, unit) {
  const W = 600, H = 220, P = { l: 44, r: 16, t: 14, b: 30 };
  const xs = pts.map(p => new Date(p.x).getTime()), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1, yMin = Math.floor(Math.min(...ys) * 0.9), yMax = Math.ceil(Math.max(...ys) * 1.05) || 1;
  const sx = x => P.l + (x - x0) / (x1 - x0 || 1) * (W - P.l - P.r), sy = y => H - P.b - (y - yMin) / (yMax - yMin || 1) * (H - P.t - P.b);
  const ticks = [yMin, (yMin + yMax) / 2, yMax].map(v => Math.round(v * 10) / 10);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${sx(xs[i]).toFixed(1)} ${sy(p.y).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart, ${pts.length} points">${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${sy(t) + 3}" text-anchor="end">${t}</text>`).join("")}
    <path d="${path} L${sx(xs.at(-1))} ${H - P.b} L${sx(xs[0])} ${H - P.b} Z" fill="var(--sage-soft)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${pts.map((p, i) => `<circle cx="${sx(xs[i])}" cy="${sy(p.y)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="var(--accent)"><title>${fmtDate(p.x)}: ${Math.round(p.y * 10) / 10} ${unit}</title></circle>`).join("")}
    <text x="${sx(xs[0])}" y="${H - 8}" text-anchor="start">${fmtDate(pts[0].x, { day: "numeric", month: "short" })}</text><text x="${sx(xs.at(-1))}" y="${H - 8}" text-anchor="end">${fmtDate(pts.at(-1).x, { day: "numeric", month: "short" })}</text>
    <text x="8" y="${P.t + 4}">${unit}</text></svg>`;
}
function barChart(data, aria) {
  const W = 600, H = 200, P = { l: 30, r: 10, t: 14, b: 30 }, max = Math.max(1, ...data.map(d => d.v));
  const bw = (W - P.l - P.r) / data.length;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><line x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}" stroke="var(--line-2)"/><text x="${P.l - 6}" y="${P.t + 4}" text-anchor="end">${max}</text><line x1="${P.l}" x2="${W - P.r}" y1="${P.t}" y2="${P.t}" stroke="var(--line)"/>
    ${data.map((d, i) => { const h = d.v / max * (H - P.t - P.b); return `<rect x="${P.l + i * bw + bw * 0.18}" y="${H - P.b - h}" width="${bw * 0.64}" height="${h}" rx="3" fill="${i === data.length - 1 ? "var(--accent)" : "var(--sage)"}"><title>${esc(d.l)}: ${d.v}</title></rect>${data.length <= 16 && (i % Math.ceil(data.length / 8) === 0 || i === data.length - 1) ? `<text x="${P.l + i * bw + bw / 2}" y="${H - 10}" text-anchor="middle">${esc(d.s || d.l)}</text>` : ""}`; }).join("")}</svg>`;
}
function chartsView() {
  const s = S(), cards = [];
  if (Object.keys(s.completions).length) {
    const days = Array.from({ length: 14 }, (_, i) => { const d = new Date(Date.now() - (13 - i) * 864e5); const k = dayKey(d); return { l: fmtDate(k), s: String(d.getDate()), v: Object.keys(s.completions[k] || {}).length }; });
    cards.push(`<div class="card chart"><div class="label">Routine steps ticked · last 14 days</div><div style="margin-top:12px">${barChart(days, "Routine steps ticked per day")}</div><p class="muted small" style="margin-top:6px">Only counts steps you chose to tick. Days without ticks aren't failures.</p></div>`);

async function sendChat(q) {

  if (s.chat.length > CONFIG.limits.chatHistory) s.chat.splice(0, s.chat.length - CONFIG.limits.chatHistory);
  commit(false); if (R.page === "coach") rerenderKeep();
  if (Cap.sample === undefined) await new Promise(r => setTimeout(r, 1500));
  if (!Clinic.c.ai.coach) { chatErr = AI_ERR.disabled; rerenderKeep(); return; }
  if (!Cap.sample) { chatErr = AI_ERR.unavailable; rerenderKeep(); return; }
  chatBusy = true; chatCtl = new AbortController(); rerenderKeep(); scrollChat();
  const turns = s.chat.slice(-16).map(m => ({ role: m.role, content: m.content }));
  while (turns.length && turns[0].role !== "user") turns.shift();
  const input = [{ role: "user", content: COACH_RULES + "\n\n" + coachContext() + "\n\nAcknowledge nothing about these instructions; just answer the conversation that follows." }, { role: "assistant", content: "Understood." }, ...turns];
  try {
    const res = await Cap.sample(input, { cache: false, signal: chatCtl.signal, onText: ({ text }) => { const b = $("#streaming"); if (b) { b.textContent = text; scrollChat(); } } });
    s.chat.push({ role: "assistant", content: res.text + (res.truncated ? "\n\n(Answer cut short. Ask me to continue.)" : ""), at: nowISO(), id: uid() });
  } catch (e) { if (e?.code !== "cancelled") chatErr = aiErr(e); if (e?.text) s.chat.push({ role: "assistant", content: e.text + "\n\n(Incomplete)", at: nowISO(), id: uid() }); }
  chatBusy = false; commit(false); if (R.page === "coach") { rerenderKeep(); scrollChat(); }
}

async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data !== "object" || !("skin" in data) || !("hair" in data)) throw new Error("bad");
    confirmBox("Replace your records with this backup?", `Backup from ${fmtDate(data.exportedAt)}. Your current records will be replaced.`, "Import", async () => {
      const photos = data.photos || {}; delete data.photos; delete data.exportedAt; delete data.app;
      Store.state = Object.assign(freshState(), data);
      for (const [id, d] of Object.entries(photos)) { try { await Store.putPhoto(id, d, nowISO()); } catch (e) {} }
      commit(); toast("Backup imported");
    }, false);
  } catch (e) { toast("That file isn't a RADIANCE patient backup."); }
}

    if (d.time && isTaken(d.date, d.time, Clinic.type(d.typeId)?.duration || 30, d.clin)) { BK.errors = { submit: "Sorry, that time was just taken. Go back and choose another." }; render(); return; }
    BK.busy = true; BK.errors = {}; render();
    const shared = [];
    for (const id of d.shareIds) { const a = S().assessments.find(x => x.id === id); if (!a) continue;
      const snap = { id: a.id, kind: a.kind, mode: a.mode, at: a.at, provider: a.provider, summary: a.result?.summary, regions: a.result?.regions || [], limitations: a.result?.limitations || [], quality: a.quality?.verdict || "", notes: a.notes || "" };
      if (d.sharePhotos && a.photoIds?.[0]) snap.photo = await Store.getPhoto(a.photoIds[0]);
      shared.push(snap); }
    const t = Clinic.type(d.typeId);
    const rec = { id: uid(), ref: "R-" + Math.random().toString(36).slice(2, 7).toUpperCase(), at: nowISO(), typeId: d.typeId, svcId: d.svcId || "", clin: d.clin || "", date: d.date, time: d.time || "", window: d.time ? "" : d.window || "Any time",
      name: d.name, phone: d.phone, email: d.email || "", reason: d.reason || "", contactPref: d.contactPref, status: "requested", shared, consentToShare: !!d.consent,
      patientId: Backend.user?.id || (S().onboarded && !S().example ? S().patientId : null), history: [{ at: nowISO(), what: "Requested online" }] };
    let delivery = "device", error = null;
    try {
      if (Backend.sb) { await Ops.add("bookings", rec); delivery = "database"; }
      else if (Forms.available) {
        await Forms.send("booking-request", { ref: rec.ref, action: "NEW REQUEST", service: Clinic.svc(rec.svcId)?.name || "", appointment_type: t?.name, date: rec.date, time: rec.time || rec.window, name: rec.name, phone: rec.phone, email: rec.email, reason: rec.reason, contact_preference: rec.contactPref,
          shared_assessments: shared.map(s => `${s.kind} ${s.at.slice(0, 10)}: ${s.summary}`).join(" | ") || "none (photos are only shared through the secure portal)" });
        delivery = "inbox";
      }
    } catch (x) { error = x; }
    if (error) { BK.busy = false; BK.errors = { submit: "We couldn't send your request. Check your connection and try again, or call " + esc(Clinic.c.info.phone) + "." }; render(); return; }
    if (!Backend.sb) { rec.delivery = delivery; if (delivery === "inbox") rec.shared = rec.shared.map(s => ({ ...s, photo: undefined })); Clinic.ops.bookings.unshift(rec); Clinic.saveOps(); }
    BK.busy = false; BK.result = rec; render(); window.scrollTo(0, 0);
  }
});
function bookingResult() {
  const b = BK.result, t = Clinic.type(b.typeId), when = `${fmtDate(b.date, { weekday: "long", day: "numeric", month: "long" })}${b.time ? " at " + b.time : " (" + (b.window || "any time").toLowerCase() + ")"}`;

    <div class="row"><a class="btn ${sent ? "" : "primary"}" href="${waLink(msg)}" target="_blank" rel="noopener">${ic("whatsapp")} ${sent ? "Message the clinic on WhatsApp" : "Send by WhatsApp"}</a><a class="btn" href="tel:${esc(Clinic.c.info.phone.replace(/\s/g, ""))}">${ic("phone")} Call ${esc(Clinic.c.info.phone)}</a></div>

}

/* ============================================================

const PERM = {

  support: ["overview", "appointments", "enquiries"]
};

  ["content", "Website & contact", "globe"], ["photos", "Photos", "camera"], ["gallery", "Before & after", "eye"], ["services", "Services", "studio"], ["team", "Clinical team", "pro"], ["learn", "Articles", "learn"], ["campaigns", "Campaigns", "sparkle"],
  ["schedule", "Scheduling", "clock"], ["staff", "Staff & roles", "shield"], ["ai", "AI settings", "coach"], ["reports", "Reports", "progress"], ["audit", "Audit log", "log"]];
const ROLE_LABEL = { clinician: "Clinician", admin: "Administrator", support: "Support staff" };
const Staff = {
  session: null, view: "list", filter: "active", patientKey: null,
  load() { if (!Backend.configured) this.session = lsGet(LSK.staff); },
  can(p) { return !!this.session && PERM[this.session.role]?.includes(p); }

Staff.load();

function renderStaff() {
  applyTheme();
  const app = $("#app"); app.className = "staff"; document.title = "Staff console · RADIANCE";
  if (!Staff.session) { app.className = "site"; app.innerHTML = staffGate(); return; }

function staffGate() {

      <form id="st-login" class="stack"><label class="field" for="st-email"><span>Work email</span><input type="email" id="st-email" autocomplete="username" required></label>

document.addEventListener("submit", async e => {
  if (e.target.id !== "st-login") return; e.preventDefault();
  const m = $("#st-msg"); m.hidden = true;
  try {
    await Backend.signIn($("#st-email").value.trim(), $("#st-pass").value);
    const { data } = await Backend.sb.from("staff_roles").select("role,name,active").eq("user_id", Backend.user.id).maybeSingle();
    if (!data || !data.active) { await Backend.signOut(); m.hidden = false; m.textContent = "This account doesn't have staff access. Ask an administrator."; return; }
    Staff.session = { id: Backend.user.id, name: data.name, role: data.role }; await Backend.pullOps(); audit("Signed in"); render();
  } catch (x) { m.hidden = false; m.textContent = "Sign-in failed. Check your email and password."; }
});

      ${s.notes ? `<div class="src-block self small"><b>Patient note:</b> ${esc(s.notes)}</div>` : ""}

const NOTE_FIELDS = [["concern", "Presenting concern"], ["history", "Relevant history"], ["exam", "Examination findings"], ["assessment", "Assessment"], ["diagnosis", "Diagnosis (clinician-established)"], ["plan", "Plan"], ["followup", "Follow-up instructions"], ["review", "Next review date"]];

      <div class="card" style="background:var(--surface-2)"><label class="row small" style="flex-wrap:nowrap"><input type="checkbox" id="tm-v" ${p.verified ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--accent);flex:none"><span>I have checked this person's qualifications and professional registration</span></label><label class="field" for="tm-vb" style="margin-top:8px"><span>Verified by</span><input type="text" id="tm-vb" value="${esc(p.verifiedBy || Staff.session.name)}"></label></div>
      <label class="row small"><input type="checkbox" id="tm-p" ${p.published ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--accent)"> Show on website (only if verified)</label><p id="tm-msg" class="err-text" hidden></p></div>
      <div class="spread" style="margin-top:14px">${p.id ? `<button class="btn danger" data-a="teamDel" data-id="${p.id}">Delete</button>` : "<span></span>"}<div class="row"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="teamSave" data-id="${p.id}">Save</button></div></div>`, true); },
  teamSave: el => { const n = $("#tm-name").value.trim(), m = $("#tm-msg"); if (!n) { m.hidden = false; m.textContent = "Add a name."; return; }
    if ($("#tm-p").checked && !$("#tm-v").checked) { m.hidden = false; m.textContent = "Verify the profile before publishing it."; return; }
    let p = Clinic.c.team.find(x => x.id === el.dataset.id); if (!p) { p = { id: uid(), photo: "" }; Clinic.c.team.push(p); }
    Object.assign(p, { name: n, title: $("#tm-title").value.trim(), qualifications: $("#tm-q").value.trim(), specialties: $("#tm-s").value.trim(), languages: $("#tm-l").value.trim(), verified: $("#tm-v").checked, verifiedBy: $("#tm-v").checked ? $("#tm-vb").value.trim() : "", verifiedAt: $("#tm-v").checked ? (p.verifiedAt || nowISO()) : "", published: $("#tm-p").checked });
    Clinic.saveContent("Saved team profile " + n); closeModal(); render(); },
  teamDel: el => { Clinic.c.team = Clinic.c.team.filter(p => p.id !== el.dataset.id); Clinic.saveContent("Deleted team profile"); closeModal(); render(); },
  artEdit: el => { const a = Clinic.c.articles.find(x => x.id === el.dataset.id) || { id: "", cat: "", title: "", summary: "", body: [], reviewer: "", reviewedOn: "", published: false };
    openModal(`<div class="spread"><h3>${a.id ? "Edit article" : "New article"}</h3><button class="icon-btn" data-a="closeModal" aria-label="Close">${ic("x")}</button></div><div class="stack" style="margin-top:12px">
      <label class="field" for="ar-t"><span>Title *</span><input type="text" id="ar-t" value="${esc(a.title)}"></label><div class="grid g2"><label class="field" for="ar-c"><span>Category</span><input type="text" id="ar-c" value="${esc(a.cat)}"></label><label class="field" for="ar-svc"><span>Related service</span><select id="ar-svc"><option value="">None</option>${Clinic.c.services.map(s => `<option value="${s.id}" ${a.service === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label></div>
      <label class="field" for="ar-s"><span>Summary</span><input type="text" id="ar-s" value="${esc(a.summary)}"></label><label class="field" for="ar-b"><span>Body (blank line between paragraphs)</span><textarea id="ar-b" style="min-height:220px">${esc(a.body.join("\n\n"))}</textarea></label>
      <div class="grid g2"><label class="field" for="ar-r"><span>Clinical reviewer</span><input type="text" id="ar-r" value="${esc(a.reviewer)}" placeholder="Name of the clinician who reviewed it"></label><label class="field" for="ar-rd"><span>Review date</span><input type="date" id="ar-rd" value="${esc(a.reviewedOn)}"></label></div></div>
      <div class="spread" style="margin-top:14px">${a.id ? `<button class="btn danger" data-a="artDel" data-id="${a.id}">Delete</button>` : "<span></span>"}<div class="row"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="artSave" data-id="${a.id}">Save</button></div></div>`, true); },
  artSave: el => { const t = $("#ar-t").value.trim(); if (!t) { $("#ar-t").focus(); return; }
    let a = Clinic.c.articles.find(x => x.id === el.dataset.id); if (!a) { a = { id: t.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 50), published: false, written: dayKey(), rel: ["learn", null, "More articles"] }; Clinic.c.articles.push(a); }
    Object.assign(a, { title: t, cat: $("#ar-c").value.trim() || "General", service: $("#ar-svc").value, summary: $("#ar-s").value.trim(), body: $("#ar-b").value.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean), reviewer: $("#ar-r").value.trim(), reviewedOn: $("#ar-rd").value });
    Clinic.saveContent("Saved article " + t); closeModal(); render(); },
  artDel: el => { Clinic.c.articles = Clinic.c.articles.filter(a => a.id !== el.dataset.id); Clinic.saveContent("Deleted article"); closeModal(); render(); },
  campEdit: el => { const c = Clinic.c.campaigns.find(x => x.id === el.dataset.id) || { id: "", title: "", text: "", cta: "Learn more", link: "", start: dayKey(), end: "", published: false, cat: "" };
    openModal(`<div class="spread"><h3>${c.id ? "Edit campaign" : "New campaign"}</h3><button class="icon-btn" data-a="closeModal" aria-label="Close">${ic("x")}</button></div><div class="stack" style="margin-top:12px">
      <div class="grid g2"><label class="field" for="cm-t"><span>Title *</span><input type="text" id="cm-t" value="${esc(c.title)}"></label><label class="field" for="cm-c"><span>Category</span><input type="text" id="cm-c" value="${esc(c.cat)}" placeholder="e.g. Alopecia awareness"></label></div>
      <label class="field" for="cm-x"><span>Text</span><textarea id="cm-x">${esc(c.text)}</textarea></label><div class="grid g2"><label class="field" for="cm-cta"><span>Button label</span><input type="text" id="cm-cta" value="${esc(c.cta)}"></label><label class="field" for="cm-l"><span>Button links to</span><input type="text" id="cm-l" value="${esc(c.link)}" placeholder="e.g. services/hair-loss or book"></label></div>
      <div class="grid g2"><label class="field" for="cm-s"><span>Start</span><input type="date" id="cm-s" value="${esc(c.start)}"></label><label class="field" for="cm-e"><span>End (optional)</span><input type="date" id="cm-e" value="${esc(c.end)}"></label></div>
      <label class="row small"><input type="checkbox" id="cm-p" ${c.published ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--accent)"> Published</label><p class="muted small">Don't reuse graphic clinical photos from social media without the patient's written consent.</p></div>
      <div class="spread" style="margin-top:14px">${c.id ? `<button class="btn danger" data-a="campDel" data-id="${c.id}">Delete</button>` : "<span></span>"}<div class="row"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="campSave" data-id="${c.id}">Save</button></div></div>`, true); },
  campSave: el => { const t = $("#cm-t").value.trim(); if (!t) { $("#cm-t").focus(); return; }
    let c = Clinic.c.campaigns.find(x => x.id === el.dataset.id); if (!c) { c = { id: uid() }; Clinic.c.campaigns.unshift(c); }
    Object.assign(c, { title: t, cat: $("#cm-c").value.trim(), text: $("#cm-x").value.trim(), cta: $("#cm-cta").value.trim(), link: $("#cm-l").value.trim(), start: $("#cm-s").value, end: $("#cm-e").value, published: $("#cm-p").checked });
    Clinic.saveContent("Saved campaign " + t); closeModal(); render(); },
  campDel: el => { Clinic.c.campaigns = Clinic.c.campaigns.filter(c => c.id !== el.dataset.id); Clinic.saveContent("Deleted campaign"); closeModal(); render(); }
});
document.addEventListener("change", async e => {
  if (e.target.id === "cms-image") { const f = e.target.files?.[0]; e.target.value = ""; if (!f || !cmsImgPath) return;
    if (f.size > 8e6) { toast("Choose an image under 8 MB."); return; }
    const img = new Image(); img.onload = () => { const c = document.createElement("canvas"), k = Math.min(1, 1400 / Math.max(img.width, img.height)); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      setPath(Clinic.c, cmsImgPath, c.toDataURL("image/jpeg", .82)); Clinic.saveContent("Uploaded image"); URL.revokeObjectURL(img.src); render(); };
    img.onerror = () => toast("That file couldn't be read as an image."); img.src = URL.createObjectURL(f); }
  if (e.target.id === "cms-import") { const f = e.target.files?.[0]; e.target.value = ""; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (j.version !== 1 || !j.services) throw 0; confirmBox("Replace website content?", "This replaces services, articles, campaigns, team and contact details with the imported file.", "Import", () => { Clinic.c = Object.assign(clone(CLINIC_DEFAULTS), j); Clinic.saveContent("Imported content.json"); render(); }, false); }
    catch (x) { toast("That isn't a RADIANCE content.json file."); } }
});

/* before & after editor */
const GAL = { draft: null, side: null,
  collect() { const d = this.draft, v = id => $("#" + id)?.value.trim() ?? ""; if (!$("#gal-title")) return;
    Object.assign(d, { title: v("gal-title"), treatment: v("gal-treat"), concern: v("gal-concern"), duration: v("gal-dur"), consentRef: v("gal-ref"), consent: $("#gal-consent").checked, published: $("#gal-pub").checked }); } };
function galForm() {
  const d = GAL.draft, slot = side => `<div class="stack" style="gap:6px"><span class="label">${side}</span><div style="aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center">${d[side.toLowerCase()] ? `<img src="${d[side.toLowerCase()]}" alt="${side}" style="width:100%;height:100%;object-fit:cover">` : `<span class="muted small">No photo</span>`}</div><button class="btn sm" data-a="galPick" data-side="${side.toLowerCase()}">${ic("upload")} ${d[side.toLowerCase()] ? "Replace" : "Upload"}</button></div>`;
  return `<div class="spread"><h3>${d.id ? "Edit result" : "New before & after"}</h3><button class="icon-btn" data-a="closeModal" aria-label="Close">${ic("x")}</button></div>
    <input type="file" id="gal-file" accept="image/jpeg,image/png,image/webp" class="sr" aria-hidden="true" tabindex="-1">
    <div class="grid g2" style="margin-top:12px">${slot("Before")}${slot("After")}</div>
    <div class="grid g2" style="margin-top:12px"><label class="field" for="gal-title"><span>Title *</span><input type="text" id="gal-title" value="${esc(d.title)}" placeholder="e.g. Acne treatment"></label><label class="field" for="gal-treat"><span>Treatment</span><input type="text" id="gal-treat" value="${esc(d.treatment)}"></label></div>
    <div class="grid g2" style="margin-top:10px"><label class="field" for="gal-concern"><span>Concern</span><input type="text" id="gal-concern" value="${esc(d.concern)}" placeholder="e.g. Dark spots"></label><label class="field" for="gal-dur"><span>Time between photos</span><input type="text" id="gal-dur" value="${esc(d.duration)}" placeholder="e.g. 8 weeks"></label></div>
    <div class="card" style="margin-top:12px;background:var(--surface-2)"><label class="row small" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="gal-consent" ${d.consent ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--accent);flex:none;margin-top:2px"><span>The patient has given written consent for these photos to appear on the website.</span></label>
      <label class="field" for="gal-ref" style="margin-top:8px"><span>Consent form reference</span><input type="text" id="gal-ref" value="${esc(d.consentRef)}" placeholder="Where the signed form is filed"></label></div>
    <label class="row small" style="margin-top:10px"><input type="checkbox" id="gal-pub" ${d.published ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--accent)"> Show on the website</label>
    <p class="muted small" style="margin-top:6px">Use photos taken in similar light and angle, unedited. Crop out identifying features unless the patient agreed to be identifiable.</p><p id="gal-msg" class="err-text" hidden></p>
    <div class="spread" style="margin-top:14px">${d.id ? `<button class="btn danger" data-a="galDel" data-id="${d.id}">Delete</button>` : "<span></span>"}<div class="row"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="galSave">Save</button></div></div>`;
}
document.addEventListener("change", e => {
  if (e.target.id !== "gal-file") return; const f = e.target.files?.[0]; e.target.value = ""; if (!f) return;
  const img = new Image(); img.onload = () => { const c = document.createElement("canvas"), k = Math.min(1, 900 / Math.max(img.width, img.height)); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    GAL.draft[GAL.side] = c.toDataURL("image/jpeg", .82); URL.revokeObjectURL(img.src); openModal(galForm(), true); };
  img.onerror = () => toast("That file couldn't be read as an image."); img.src = URL.createObjectURL(f);
});

/* ---------- Patient sign-in (only when the clinic's Supabase database is connected) ---------- */
let authMode = "in", authMsg = null;
function renderPortalAuth() {
  applyTheme();
  const app = $("#app"); app.className = "site"; document.title = "Patient portal · RADIANCE";
  const f = (id, l, t, ac) => `<label class="field" for="${id}"><span>${l}</span><input type="${t}" id="${id}" autocomplete="${ac}" required></label>`;
  app.innerHTML = `<div class="ob" style="max-width:480px;padding-top:50px"><div class="spread" style="margin-bottom:24px"><button class="brand-btn" style="padding:0" data-a="site" data-path="">${brandLockup("Patient portal")}</button></div>
    <div class="card raised stack">${!Backend.ready ? `<p class="muted"><span class="spinner" style="display:inline-block"></span> Connecting securely…</p>` : Backend.error ? `<div class="notice err">${ic("warn")}<span class="small">${esc(Backend.error)}</span></div>` : `
    <h2>${{ in: "Sign in", up: "Create your account", reset: "Reset your password" }[authMode]}</h2>
    <form id="auth-form" class="stack">${authMode === "up" ? f("au-name", "Your name", "text", "name") : ""}${f("au-email", "Email", "email", "email")}${authMode !== "reset" ? f("au-pass", authMode === "up" ? "Choose a password (at least 8 characters)" : "Password", "password", authMode === "up" ? "new-password" : "current-password") : ""}
      ${authMode === "up" ? `<label class="row small" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="au-ok" required style="width:18px;height:18px;accent-color:var(--accent);flex:none;margin-top:2px"><span>I've read the <button type="button" class="btn ghost sm" style="padding:0" data-a="site" data-path="privacy">privacy notice</button> and understand AI observations aren't a diagnosis.</span></label>` : ""}
      ${authMsg ? `<div class="notice ${authMsg.ok ? "ok" : "err"} small">${esc(authMsg.text)}</div>` : ""}
      <button class="btn primary" type="submit">${{ in: "Sign in", up: "Create account", reset: "Send reset link" }[authMode]}</button></form>
    <div class="row small">${authMode !== "in" ? `<button class="btn ghost sm" data-a="authMode" data-m="in">I have an account</button>` : `<button class="btn ghost sm" data-a="authMode" data-m="up">Create an account</button><button class="btn ghost sm" data-a="authMode" data-m="reset">Forgot password?</button>`}</div>`}
    </div><p class="muted small" style="margin-top:14px">Your records are private to your account. Clinicians see only what you share with a booking.</p></div>`;
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "auth-form") return; e.preventDefault();
  const email = $("#au-email").value.trim(), pass = $("#au-pass")?.value || "";
  try {
    if (authMode === "in") { await Backend.signIn(email, pass); authMsg = null; }
    else if (authMode === "up") { if (pass.length < 8) throw new Error("Use at least 8 characters for your password."); const r = await Backend.signUp(email, pass, $("#au-name").value.trim()); authMsg = r.session ? null : { ok: true, text: "Check your email to verify your address, then sign in." }; authMode = r.session ? authMode : "in"; }
    else { await Backend.reset(email); authMsg = { ok: true, text: "If that email has an account, a reset link is on its way." }; }
  } catch (x) { authMsg = { ok: false, text: x.message?.includes("Invalid login") ? "Email or password is incorrect." : x.message || "Something went wrong. Try again." }; }
  render();
});
Object.assign(ACTIONS, {
  authMode: el => { authMode = el.dataset.m; authMsg = null; render(); },
  signOut: async () => { await Backend.signOut(); Store.state = freshState(); Store.mode = "local"; nav(""); }
});

/* ---------- Boot ---------- */
const applyScale = () => { document.documentElement.style.fontSize = (SURFACE === "app" ? (S().settings.textScale || "100") : "100") + "%"; };
const _applyTheme = applyTheme; applyTheme = () => { _applyTheme(); applyScale(); };
(async function boot() {
  Store.loadLocal();
  routeFromHash();
  render(); Cap.init(); Store.connectCloud(); Clinic.loadPublished();
  await Backend.init();
  if (Backend.user) {
    await Store.onAuth();
    try { const { data } = await Backend.sb.from("staff_roles").select("role,name,active").eq("user_id", Backend.user.id).maybeSingle();
      if (data?.active) { Staff.session = { id: Backend.user.id, name: data.name, role: data.role }; await Backend.pullOps(); }
      else { const { data: mine } = await Backend.sb.from("bookings").select("*").order("created_at", { ascending: false }); Clinic.ops.bookings = (mine || []).map(r => ({ ...r.json, id: r.id, status: r.status || r.json.status }));
        const { data: plans } = await Backend.sb.from("care_plans").select("*"); Clinic.ops.carePlans = (plans || []).map(r => ({ ...r.json, id: r.id })); } } catch (e) {}
    render();
  }
})();
</script>
</body></html>
